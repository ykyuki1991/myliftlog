<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MyLiftLog</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { overscroll-behavior: none; }
    body { background: #FFFFFF; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    input, button, select { font-family: inherit; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback, useMemo, useEffect, useRef } = React;

    // ============================================================
    // MyLiftLog - ステップ4: 今日の記録 + 履歴 + 設定画面
    // ============================================================

    // --- ユーティリティ ---
    const generateId = () =>
      typeof crypto !== "undefined" && crypto.randomUUID
        ? crypto.randomUUID()
        : Math.random().toString(36).slice(2) + Date.now().toString(36);

    const now = () => new Date().toISOString();
    const todayStr = () => new Date().toISOString().slice(0, 10);

    const formatDateJP = (dateStr) => {
      const d = new Date(dateStr + "T00:00:00");
      const dow = ["日", "月", "火", "水", "木", "金", "土"][d.getDay()];
      return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}（${dow}）`;
    };

    // --- 部位選択肢 ---
    const MUSCLE_GROUPS = ["胸", "背中", "肩", "脚", "腕"];

    // --- 初期種目→部位マッピング ---
    const DEFAULT_MUSCLE_MAP = {
      "ベンチプレス": "胸", "インクラインダンベルプレス": "胸",
      "ラットプルダウン": "背中", "バーベルロウ": "背中",
      "サイドレイズ": "肩", "ショルダープレス": "肩",
      "スクワット": "脚", "デッドリフト": "脚", "レッグプレス": "脚", "レッグカール": "脚",
      "アームカール": "腕",
    };

    // --- 初期種目マスタ ---
    const DEFAULT_EXERCISES = [
      "ベンチプレス", "スクワット", "デッドリフト",
      "インクラインダンベルプレス", "ラットプルダウン", "バーベルロウ",
      "サイドレイズ", "レッグプレス", "レッグカール",
    ].map((name, i) => ({
      id: generateId(), name, sortOrder: i, isActive: true, createdAt: now(),
      muscleGroup: DEFAULT_MUSCLE_MAP[name] || "胸",
    }));

    // --- 既存データのmuscleGroupマイグレーション ---
    const migrateExercises = (exercises) =>
      exercises.map((e) => e.muscleGroup ? e : { ...e, muscleGroup: DEFAULT_MUSCLE_MAP[e.name] || "胸" });

    // --- Big3種目名（推定1RM表示対象） ---
    const BIG3_NAMES = ["ベンチプレス", "スクワット", "デッドリフト"];

    // --- 推定1RM計算（Epley式） ---
    const calcE1RM = (weight, reps) => {
      if (weight <= 0 || reps <= 0) return 0;
      if (reps === 1) return weight;
      return weight * (1 + reps / 30);
    };

    // ワークアウト内の特定種目の最大推定1RMを算出
    const getWorkoutE1RM = (setsForExercise) => {
      let max1RM = 0;
      setsForExercise.forEach((s) => {
        const e1rm = calcE1RM(s.weight, s.reps);
        if (e1rm > max1RM) max1RM = e1rm;
      });
      return max1RM > 0 ? Math.round(max1RM * 10) / 10 : null;
    };

    // --- 今週の月曜〜日曜の範囲を算出 ---
    const getWeekRange = () => {
      const today = new Date();
      const day = today.getDay(); // 0=日, 1=月, ...
      const diff = day === 0 ? 6 : day - 1; // 月曜からの日数差
      const mon = new Date(today);
      mon.setDate(today.getDate() - diff);
      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);
      return {
        start: mon.toISOString().slice(0, 10),
        end: sun.toISOString().slice(0, 10),
      };
    };

    // --- PR（自己ベスト）計算 ---
    // 種目の全セットからPRを算出: { weight, reps, workoutId }
    // 判定: 最大重量 → 同重量なら最大回数
    const findPR = (allSets, exerciseId) => {
      let pr = null;
      allSets.forEach((s) => {
        if (s.exerciseId !== exerciseId || s.weight <= 0 || s.reps <= 0) return;
        if (!pr || s.weight > pr.weight || (s.weight === pr.weight && s.reps > pr.reps)) {
          pr = { weight: s.weight, reps: s.reps, workoutId: s.workoutId, setId: s.id };
        }
      });
      return pr;
    };

    // セットがPRかどうかを判定
    const isPRSet = (set, allSets, exerciseId) => {
      if (set.weight <= 0 || set.reps <= 0) return false;
      const pr = findPR(allSets, exerciseId);
      return pr && pr.weight === set.weight && pr.reps === set.reps && pr.setId === set.id;
    };

    // --- カラー定数（設計書 7-1） ---
    const C = {
      bg: "#FFFFFF",
      text: "#1A1A1A",
      sub: "#6B7280",
      accent: "#2563EB",
      danger: "#DC2626",
      cardBg: "#F9FAFB",
      border: "#E5E7EB",
      prBadge: "#F59E0B",
      warning: "#F59E0B",
      warningBg: "#FEF3C7",
      success: "#059669",
    };

    // --- 食事区分 ---
    const MEAL_TYPES = [
      { key: "breakfast", label: "朝食" },
      { key: "lunch", label: "昼食" },
      { key: "dinner", label: "夕食" },
      { key: "preworkout", label: "トレ前" },
      { key: "postworkout", label: "トレ後" },
      { key: "snack", label: "その他間食" },
    ];

    // --- 活動量係数 ---
    const ACTIVITY_MULTIPLIERS = { low: 1.2, slightlyLow: 1.375, normal: 1.55, high: 1.725 };
    const ACTIVITY_LABELS = { low: "低い", slightlyLow: "やや低い", normal: "普通", high: "高い" };

    // --- Mifflin-St Jeor BMR計算 ---
    const calcBMR = (sex, weightKg, heightCm, age) => {
      if (sex === "male") return 10 * weightKg + 6.25 * heightCm - 5 * age + 5;
      return 10 * weightKg + 6.25 * heightCm - 5 * age - 161;
    };

    // --- 目標自動計算 ---
    const calcNutritionGoals = (profile, bodyWeightKg) => {
      const w = bodyWeightKg || 70;
      const bmr = calcBMR(profile.sex, w, profile.heightCm, profile.age);
      const mult = ACTIVITY_MULTIPLIERS[profile.activityLevel] || 1.55;
      const maintenance = Math.round(bmr * mult);

      let restKcal = maintenance;
      if (profile.goalType === "cut") restKcal = maintenance - 300;
      if (profile.goalType === "bulk") restKcal = maintenance + 300;
      const trainingKcal = restKcal + 200;

      const proteinG = Math.round(w * (profile.goalType === "bulk" ? 1.8 : 2.0));
      const restFatG = Math.round((restKcal * 0.25) / 9);
      const trainingFatG = Math.round((trainingKcal * 0.25) / 9);
      const restCarbsG = Math.round((restKcal - proteinG * 4 - restFatG * 9) / 4);
      const trainingCarbsG = Math.round((trainingKcal - proteinG * 4 - trainingFatG * 9) / 4);

      return {
        trainingDay: { kcal: trainingKcal, protein: proteinG, fat: trainingFatG, carbs: trainingCarbsG },
        restDay: { kcal: restKcal, protein: proteinG, fat: restFatG, carbs: restCarbsG },
        isManualOverride: false,
      };
    };

    // ============================================================
    // カスタムフック: useMyLiftLogDB（ステップ1から継承）
    // ============================================================
    function useMyLiftLogDB() {
      const STORAGE_KEY = "myliftlog_data";

      const DEFAULT_NUTRITION_SETTINGS = {
        profile: { sex: "male", age: 30, heightCm: 170, activityLevel: "normal", trainingDaysPerWeek: 4, goalType: "maintain" },
        goals: { trainingDay: { kcal: 2500, protein: 150, fat: 69, carbs: 250 }, restDay: { kcal: 2300, protein: 150, fat: 64, carbs: 219 }, isManualOverride: false },
      };

      const CURRENT_SCHEMA_VERSION = 2;

      const loadData = () => {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) {
            const parsed = JSON.parse(stored);
            // 後方互換: schemaVersion が無い場合は v1 として扱う
            return {
              schemaVersion: parsed.schemaVersion || 1,
              exercises: migrateExercises(parsed.exercises || DEFAULT_EXERCISES),
              workouts: parsed.workouts || [],
              sets: parsed.sets || [],
              templates: parsed.templates || [],
              foods: parsed.foods || [],
              mealTemplates: parsed.mealTemplates || [],
              mealEntries: parsed.mealEntries || [],
              nutritionSettings: parsed.nutritionSettings || DEFAULT_NUTRITION_SETTINGS,
              trainingDayOverrides: parsed.trainingDayOverrides || {},
            };
          }
        } catch (e) {
          console.error("Failed to load from localStorage:", e);
        }
        return {
          schemaVersion: CURRENT_SCHEMA_VERSION,
          exercises: DEFAULT_EXERCISES,
          workouts: [],
          sets: [],
          templates: [],
          foods: [],
          mealTemplates: [],
          mealEntries: [],
          nutritionSettings: DEFAULT_NUTRITION_SETTINGS,
          trainingDayOverrides: {},
        };
      };

      const saveData = (exercises, workouts, sets, templates, foods, mealTemplates, mealEntries, nutritionSettings, trainingDayOverrides) => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            schemaVersion: CURRENT_SCHEMA_VERSION,
            exercises, workouts, sets, templates, foods, mealTemplates, mealEntries, nutritionSettings, trainingDayOverrides,
          }));
        } catch (e) {
          console.error("Failed to save to localStorage:", e);
        }
      };

      const initialData = loadData();
      const [exercises, setExercises] = useState(initialData.exercises);
      const [workouts, setWorkouts] = useState(initialData.workouts);
      const [sets, setSets] = useState(initialData.sets);
      const [templates, setTemplates] = useState(initialData.templates);
      const [foods, setFoods] = useState(initialData.foods);
      const [mealTemplates, setMealTemplates] = useState(initialData.mealTemplates);
      const [mealEntries, setMealEntries] = useState(initialData.mealEntries);
      const [nutritionSettings, setNutritionSettings] = useState(initialData.nutritionSettings);
      const [trainingDayOverrides, setTrainingDayOverrides] = useState(initialData.trainingDayOverrides);

      // Save to localStorage whenever data changes
      useEffect(() => {
        saveData(exercises, workouts, sets, templates, foods, mealTemplates, mealEntries, nutritionSettings, trainingDayOverrides);
      }, [exercises, workouts, sets, templates, foods, mealTemplates, mealEntries, nutritionSettings, trainingDayOverrides]);

      const addExercise = useCallback((name, muscleGroup) => {
        let newEx = null;
        setExercises((prev) => {
          const maxSort = prev.reduce((m, e) => Math.max(m, e.sortOrder), -1);
          newEx = { id: generateId(), name, sortOrder: maxSort + 1, isActive: true, createdAt: now(), muscleGroup: muscleGroup || "胸" };
          return [...prev, newEx];
        });
        return newEx;
      }, []);

      const updateExercise = useCallback((id, updates) => {
        setExercises((prev) => prev.map((e) => (e.id === id ? { ...e, ...updates } : e)));
      }, []);

      const deleteExercise = useCallback((id) => {
        setExercises((prev) => prev.map((e) => (e.id === id ? { ...e, isActive: false } : e)));
      }, []);

      const activeExercises = useMemo(
        () => exercises.filter((e) => e.isActive).sort((a, b) => a.sortOrder - b.sortOrder),
        [exercises]
      );

      const getOrCreateWorkout = useCallback((date) => {
        let result = null;
        setWorkouts((prev) => {
          const existing = prev.find((w) => w.date === date);
          if (existing) { result = existing; return prev; }
          result = { id: generateId(), date, bodyWeight: null, memo: "", createdAt: now(), updatedAt: now() };
          return [...prev, result];
        });
        return result;
      }, []);

      const updateWorkout = useCallback((id, updates) => {
        setWorkouts((prev) => prev.map((w) => (w.id === id ? { ...w, ...updates, updatedAt: now() } : w)));
      }, []);

      const deleteWorkout = useCallback((id) => {
        setWorkouts((prev) => prev.filter((w) => w.id !== id));
        setSets((prev) => prev.filter((s) => s.workoutId !== id));
      }, []);

      const getWorkoutByDate = useCallback(
        (date) => workouts.find((w) => w.date === date) || null,
        [workouts]
      );

      const addSet = useCallback((workoutId, exerciseId, weight, reps, memo) => {
        let newSet = null;
        setSets((prev) => {
          const sameSets = prev.filter((r) => r.workoutId === workoutId && r.exerciseId === exerciseId);
          const maxOrder = sameSets.reduce((m, r) => Math.max(m, r.setOrder), 0);
          newSet = { id: generateId(), workoutId, exerciseId, setOrder: maxOrder + 1, weight, reps, memo: memo || "", createdAt: now() };
          return [...prev, newSet];
        });
        return newSet;
      }, []);

      const updateSet = useCallback((id, updates) => {
        setSets((prev) => prev.map((s) => (s.id === id ? { ...s, ...updates } : s)));
      }, []);

      const deleteSet = useCallback((id) => {
        setSets((prev) => {
          const target = prev.find((s) => s.id === id);
          if (!target) return prev;
          const remaining = prev.filter((s) => s.id !== id);
          let order = 1;
          return remaining.map((s) => {
            if (s.workoutId === target.workoutId && s.exerciseId === target.exerciseId) {
              return { ...s, setOrder: order++ };
            }
            return s;
          });
        });
      }, []);

      const getSetsForWorkoutExercise = useCallback(
        (workoutId, exerciseId) =>
          sets.filter((s) => s.workoutId === workoutId && s.exerciseId === exerciseId).sort((a, b) => a.setOrder - b.setOrder),
        [sets]
      );

      const getPreviousRecord = useCallback(
        (exerciseId, currentDate) => {
          const matchingSets = sets.filter((s) => s.exerciseId === exerciseId);
          if (matchingSets.length === 0) return null;
          const workoutMap = {};
          workouts.forEach((w) => { workoutMap[w.id] = w; });
          const pastSets = matchingSets.filter((s) => {
            const w = workoutMap[s.workoutId];
            return w && w.date < currentDate;
          });
          if (pastSets.length === 0) return null;
          let latestDate = "";
          let latestWorkoutId = "";
          pastSets.forEach((s) => {
            const w = workoutMap[s.workoutId];
            if (w && w.date > latestDate) { latestDate = w.date; latestWorkoutId = w.id; }
          });
          const resultSets = pastSets
            .filter((s) => s.workoutId === latestWorkoutId)
            .filter((s) => s.weight > 0 || s.reps > 0) // 空セット除外
            .sort((a, b) => a.setOrder - b.setOrder)
            .map((s) => ({ weight: s.weight, reps: s.reps }));
          if (resultSets.length === 0) return null;
          return { date: latestDate, sets: resultSets };
        },
        [sets, workouts]
      );

      const getExercisesInWorkout = useCallback(
        (workoutId) => {
          const workoutSets = sets.filter((s) => s.workoutId === workoutId);
          const exerciseIds = [...new Set(workoutSets.map((s) => s.exerciseId))];
          return exerciseIds.map((eid) => {
            const ex = exercises.find((e) => e.id === eid);
            return {
              exerciseId: eid,
              exerciseName: ex ? ex.name : "(削除済み)",
              sets: workoutSets.filter((s) => s.exerciseId === eid).sort((a, b) => a.setOrder - b.setOrder),
            };
          });
        },
        [sets, exercises]
      );

      const removeExerciseFromWorkout = useCallback((workoutId, exerciseId) => {
        setSets((prev) => prev.filter((s) => !(s.workoutId === workoutId && s.exerciseId === exerciseId)));
      }, []);

      // ---------- テンプレートCRUD ----------
      const addTemplate = useCallback((name, exerciseIds) => {
        let newTpl = null;
        setTemplates((prev) => {
          if (prev.length >= 10) return prev;
          newTpl = { id: generateId(), name, exerciseIds };
          return [...prev, newTpl];
        });
        return newTpl;
      }, []);

      const updateTemplate = useCallback((id, updates) => {
        setTemplates((prev) => prev.map((t) => (t.id === id ? { ...t, ...updates } : t)));
      }, []);

      const deleteTemplate = useCallback((id) => {
        setTemplates((prev) => prev.filter((t) => t.id !== id));
      }, []);

      // ---------- 全データ初期化 ----------
      const resetAll = useCallback(() => {
        setExercises(DEFAULT_EXERCISES.map((e) => ({ ...e, id: generateId(), createdAt: now() })));
        setWorkouts([]);
        setSets([]);
        setTemplates([]);
        setFoods([]);
        setMealTemplates([]);
        setMealEntries([]);
        setNutritionSettings(DEFAULT_NUTRITION_SETTINGS);
        setTrainingDayOverrides({});
      }, []);

      // ---------- CSVインポート ----------
      const importData = useCallback((parsedRows, mode) => {
        // mode: "overwrite" | "append"
        // parsedRows: [{date, bodyWeight, workoutMemo, exerciseName, setNumber, weight, reps, exerciseMemo}, ...]

        let currentExercises;
        if (mode === "overwrite") {
          // 上書きモード: 既存データを全削除し、デフォルト種目をベースにする
          currentExercises = DEFAULT_EXERCISES.map((e) => ({ ...e, id: generateId(), createdAt: now() }));
        } else {
          // 追加モード: 既存種目をコピーして使う
          currentExercises = [...exercises];
        }

        // CSV内の種目名を集めて、マスタに無ければ追加
        const exerciseNames = [...new Set(parsedRows.filter((r) => r.exerciseName).map((r) => r.exerciseName))];
        exerciseNames.forEach((name) => {
          const exists = currentExercises.find((e) => e.name === name && e.isActive);
          if (!exists) {
            // 非アクティブだが存在する場合は再有効化
            const inactive = currentExercises.find((e) => e.name === name && !e.isActive);
            if (inactive) {
              inactive.isActive = true;
            } else {
              // CSVに部位があればそれを使用、なければマッピングorデフォルト
              const rowWithName = parsedRows.find((r) => r.exerciseName === name);
              const mg = (rowWithName && rowWithName.muscleGroup && MUSCLE_GROUPS.includes(rowWithName.muscleGroup))
                ? rowWithName.muscleGroup
                : (DEFAULT_MUSCLE_MAP[name] || "胸");
              const maxSort = currentExercises.reduce((m, e) => Math.max(m, e.sortOrder), -1);
              currentExercises.push({
                id: generateId(), name, sortOrder: maxSort + 1, isActive: true, createdAt: now(),
                muscleGroup: mg,
              });
            }
          }
        });

        let newWorkouts = mode === "overwrite" ? [] : [...workouts];
        let newSets = mode === "overwrite" ? [] : [...sets];

        // 日付ごとにグループ化
        const dateGroups = {};
        parsedRows.forEach((row) => {
          if (!dateGroups[row.date]) dateGroups[row.date] = [];
          dateGroups[row.date].push(row);
        });

        Object.keys(dateGroups).forEach((date) => {
          // 追加モード: 同一日付のworkoutが既にあればスキップ
          if (mode === "append") {
            const existingWorkout = newWorkouts.find((w) => w.date === date);
            if (existingWorkout) return; // スキップ
          }

          const rows = dateGroups[date];
          const firstRow = rows[0];

          // Workout作成
          const workoutId = generateId();
          const bodyWeight = firstRow.bodyWeight !== "" && !isNaN(parseFloat(firstRow.bodyWeight))
            ? parseFloat(firstRow.bodyWeight)
            : null;
          newWorkouts.push({
            id: workoutId,
            date,
            bodyWeight,
            memo: firstRow.workoutMemo || "",
            createdAt: now(),
            updatedAt: now(),
          });

          // セットを追加（種目名がある行のみ）
          rows.forEach((row) => {
            if (!row.exerciseName) return;
            const ex = currentExercises.find((e) => e.name === row.exerciseName && e.isActive);
            if (!ex) return;
            const weight = parseFloat(row.weight) || 0;
            const reps = parseInt(row.reps, 10) || 0;
            if (weight <= 0 && reps <= 0) return;
            newSets.push({
              id: generateId(),
              workoutId,
              exerciseId: ex.id,
              setOrder: parseInt(row.setNumber, 10) || 1,
              weight,
              reps,
              memo: row.exerciseMemo || "",
              createdAt: now(),
            });
          });
        });

        setExercises(currentExercises);
        setWorkouts(newWorkouts);
        setSets(newSets);
      }, [exercises, workouts, sets]);

      // ---------- 食材マスタ CRUD ----------
      const addFood = useCallback((name, baseAmount, baseUnit, kcal, protein, fat, carbs, isFavorite) => {
        let newFood = null;
        setFoods((prev) => {
          newFood = { id: generateId(), name, baseAmount: baseAmount || 100, baseUnit: baseUnit || "g", kcal, protein, fat, carbs, isFavorite: isFavorite !== false, createdAt: now() };
          return [...prev, newFood];
        });
        return newFood;
      }, []);

      const updateFood = useCallback((id, updates) => {
        setFoods((prev) => prev.map((f) => (f.id === id ? { ...f, ...updates } : f)));
      }, []);

      const deleteFood = useCallback((id) => {
        setFoods((prev) => prev.filter((f) => f.id !== id));
      }, []);

      // ---------- 食事記録 CRUD ----------
      const addMealEntry = useCallback((date, mealType, foodId, templateId, nameSnapshot, amount, unit, kcal, protein, fat, carbs) => {
        let newEntry = null;
        setMealEntries((prev) => {
          newEntry = {
            id: generateId(), date, mealType,
            sourceType: foodId ? "food" : "manual",
            foodId: foodId || null, templateId: templateId || null,
            nameSnapshot, amount, unit,
            kcal: Math.round(kcal), protein: Math.round(protein * 10) / 10,
            fat: Math.round(fat * 10) / 10, carbs: Math.round(carbs * 10) / 10,
            createdAt: now(),
          };
          return [...prev, newEntry];
        });
        return newEntry;
      }, []);

      const deleteMealEntry = useCallback((id) => {
        setMealEntries((prev) => prev.filter((e) => e.id !== id));
      }, []);

      // ---------- 食事テンプレ CRUD ----------
      const addMealTemplate = useCallback((name, items) => {
        let tpl = null;
        setMealTemplates((prev) => {
          tpl = { id: generateId(), name, items, createdAt: now() };
          return [...prev, tpl];
        });
        return tpl;
      }, []);

      const updateMealTemplate = useCallback((id, updates) => {
        setMealTemplates((prev) => prev.map((t) => (t.id === id ? { ...t, ...updates } : t)));
      }, []);

      const deleteMealTemplate = useCallback((id) => {
        setMealTemplates((prev) => prev.filter((t) => t.id !== id));
      }, []);

      // ---------- 栄養設定 ----------
      const updateNutritionSettings = useCallback((updates) => {
        setNutritionSettings((prev) => ({ ...prev, ...updates }));
      }, []);

      const updateNutritionGoals = useCallback((goals) => {
        setNutritionSettings((prev) => ({ ...prev, goals }));
      }, []);

      // ---------- トレ日/休養日 手動上書き ----------
      const setTrainingDayOverride = useCallback((date, dayType) => {
        // dayType: "training" | "rest" | null (nullで上書き解除)
        setTrainingDayOverrides((prev) => {
          if (dayType === null) {
            const next = { ...prev };
            delete next[date];
            return next;
          }
          return { ...prev, [date]: dayType };
        });
      }, []);

      // ---------- 全データJSON取得（バックアップ用） ----------
      const exportAllData = useCallback(() => {
        return JSON.stringify({
          schemaVersion: CURRENT_SCHEMA_VERSION,
          exercises, workouts, sets, templates, foods, mealTemplates, mealEntries, nutritionSettings, trainingDayOverrides,
          exportedAt: now(),
        }, null, 2);
      }, [exercises, workouts, sets, templates, foods, mealTemplates, mealEntries, nutritionSettings, trainingDayOverrides]);

      // ---------- 全データJSON復元（リストア用） ----------
      const importAllData = useCallback((jsonStr) => {
        try {
          const data = JSON.parse(jsonStr);
          if (!data.exercises || !Array.isArray(data.exercises)) throw new Error("Invalid backup: exercises missing");
          setExercises(migrateExercises(data.exercises));
          setWorkouts(data.workouts || []);
          setSets(data.sets || []);
          setTemplates(data.templates || []);
          setFoods(data.foods || []);
          setMealTemplates(data.mealTemplates || []);
          setMealEntries(data.mealEntries || []);
          setNutritionSettings(data.nutritionSettings || DEFAULT_NUTRITION_SETTINGS);
          setTrainingDayOverrides(data.trainingDayOverrides || {});
          return { success: true };
        } catch (e) {
          return { success: false, error: e.message };
        }
      }, []);

      return {
        exercises, activeExercises, workouts, sets, templates,
        addExercise, updateExercise, deleteExercise,
        getOrCreateWorkout, updateWorkout, deleteWorkout, getWorkoutByDate,
        addSet, updateSet, deleteSet, getSetsForWorkoutExercise,
        getPreviousRecord, getExercisesInWorkout, removeExerciseFromWorkout,
        addTemplate, updateTemplate, deleteTemplate,
        resetAll, importData,
        // nutrition
        foods, mealTemplates, mealEntries, nutritionSettings, trainingDayOverrides,
        addFood, updateFood, deleteFood,
        addMealEntry, deleteMealEntry,
        addMealTemplate, updateMealTemplate, deleteMealTemplate,
        updateNutritionSettings, updateNutritionGoals,
        setTrainingDayOverride,
        exportAllData, importAllData,
      };
    }

    // ============================================================
    // コンポーネント: バックアップバナー（BackupBanner）
    // ============================================================
    function BackupBanner() {
      const [showBanner, setShowBanner] = useState(false);

      useEffect(() => {
        try {
          const lastExport = localStorage.getItem("myliftlog_last_export");
          if (!lastExport) {
            setShowBanner(true);
          } else {
            const lastDate = new Date(lastExport);
            const daysDiff = Math.floor((new Date() - lastDate) / (1000 * 60 * 60 * 24));
            if (daysDiff >= 30) {
              setShowBanner(true);
            }
          }
        } catch (e) {
          console.error("Failed to check backup date:", e);
        }
      }, []);

      if (!showBanner) return null;

      return (
        <div style={{
          padding: "12px 16px",
          background: "#FEF3C7",
          borderBottom: "1px solid #F59E0B",
          fontSize: 13,
          color: "#92400E",
          display: "flex",
          alignItems: "center",
          gap: 8,
          justifyContent: "space-between",
        }}>
          <div>30日以上バックアップを取っていません。CSVエクスポートをお勧めします。</div>
          <button
            onClick={() => setShowBanner(false)}
            style={{
              background: "none",
              border: "none",
              color: "#92400E",
              fontSize: 16,
              cursor: "pointer",
              padding: "0 4px",
              flexShrink: 0,
            }}
          >
            ×
          </button>
        </div>
      );
    }

    // ============================================================
    // コンポーネント: 前回記録表示（PreviousRecord）
    // ============================================================
    function PreviousRecord({ db, exerciseId, currentDate }) {
      const prev = db.getPreviousRecord(exerciseId, currentDate);
      if (!prev) {
        return <div style={{ fontSize: 13, color: C.sub, marginBottom: 8 }}>前回: 記録なし</div>;
      }
      return (
        <div style={{ fontSize: 13, color: C.sub, marginBottom: 8, lineHeight: 1.6 }}>
          <div>前回: {formatDateJP(prev.date)}</div>
          <div style={{ paddingLeft: 4 }}>
            {prev.sets.map((s, i) => (
              <span key={i}>{i > 0 && " / "}{s.weight}kg×{s.reps}</span>
            ))}
          </div>
        </div>
      );

    // ============================================================
    // コンポーネント: セット入力行（SetRow）
    // ============================================================
    function SetRow({ set, onUpdate, onDelete, isPR }) {
      const [weight, setWeight] = useState(set.weight > 0 ? String(set.weight) : "");
      const [reps, setReps] = useState(set.reps > 0 ? String(set.reps) : "");

      const handleWeightBlur = () => {
        const v = parseFloat(weight);
        if (!isNaN(v) && v > 0 && v !== set.weight) {
          onUpdate(set.id, { weight: v });
        } else if (weight === "" || isNaN(v) || v <= 0) {
          setWeight(set.weight > 0 ? String(set.weight) : "");
        }
      };

      const handleRepsBlur = () => {
        const v = parseInt(reps, 10);
        if (!isNaN(v) && v > 0 && v !== set.reps) {
          onUpdate(set.id, { reps: v });
        } else if (reps === "" || isNaN(v) || v <= 0) {
          setReps(set.reps > 0 ? String(set.reps) : "");
        }
      };

      return (
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
          <span style={{ fontSize: 13, color: C.sub, width: 36, flexShrink: 0, textAlign: "right" }}>
            {set.setOrder}
          </span>
          <input
            type="number"
            inputMode="decimal"
            step="0.5"
            value={weight}
            onChange={(e) => setWeight(e.target.value)}
            onBlur={handleWeightBlur}
            placeholder="kg"
            style={{
              width: 72, height: 44, padding: "0 8px",
              border: `1px solid ${C.border}`, borderRadius: 6,
              fontSize: 18, textAlign: "center", background: C.bg,
            }}
          />
          <span style={{ fontSize: 13, color: C.sub }}>kg</span>
          <input
            type="number"
            inputMode="numeric"
            value={reps}
            onChange={(e) => setReps(e.target.value)}
            onBlur={handleRepsBlur}
            placeholder="回"
            style={{
              width: 56, height: 44, padding: "0 8px",
              border: `1px solid ${C.border}`, borderRadius: 6,
              fontSize: 18, textAlign: "center", background: C.bg,
            }}
          />
          <span style={{ fontSize: 13, color: C.sub }}>回</span>
          {isPR && (
            <span style={{
              fontSize: 10, fontWeight: 800, color: "#fff", background: C.prBadge,
              borderRadius: 4, padding: "2px 5px", flexShrink: 0, lineHeight: 1,
            }}>PR!</span>
          )}
          <button
            onClick={() => onDelete(set.id)}
            style={{
              width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center",
              background: "none", border: "none", color: C.danger,
              fontSize: 18, cursor: "pointer", flexShrink: 0, marginLeft: "auto",
            }}
            aria-label="セット削除"
          >
            ×
          </button>
        </div>
      );
    }

    // ============================================================
    // コンポーネント: 種目ブロック（ExerciseBlock）
    // ============================================================
    function ExerciseBlock({ db, workoutId, exerciseId, exerciseName, currentDate, setsData, onRemove }) {
      const [memo, setMemo] = useState(setsData.length > 0 ? setsData[0].memo || "" : "");

      // setsData の memo が外部で変化した場合に同期
      const externalMemo = setsData.length > 0 ? setsData[0].memo || "" : "";
      const [prevExternalMemo, setPrevExternalMemo] = useState(externalMemo);
      if (externalMemo !== prevExternalMemo) {
        setPrevExternalMemo(externalMemo);
        if (externalMemo && !memo) setMemo(externalMemo);
      }

      const handleAddSet = () => {
        // blur をトリガーして SetRow の入力値を先に DB へ反映
        if (document.activeElement instanceof HTMLElement) {
          document.activeElement.blur();
        }
        // DB の最新値を読み取る（stale closure 回避）
        const freshSets = db.getSetsForWorkoutExercise(workoutId, exerciseId);
        const lastSet = freshSets.length > 0 ? freshSets[freshSets.length - 1] : null;
        const w = lastSet && lastSet.weight > 0 ? lastSet.weight : 0;
        const r = lastSet && lastSet.reps > 0 ? lastSet.reps : 0;
        db.addSet(workoutId, exerciseId, w, r, memo);
      };

      const handleMemoBlur = () => {
        // 同一 workout+exercise の全セットにメモを反映
        setsData.forEach((s) => {
          db.updateSet(s.id, { memo });
        });
      };

      return (
        <div style={{
          background: C.cardBg, borderRadius: 10, padding: 14,
          marginBottom: 12, border: `1px solid ${C.border}`,
        }}>
          {/* ヘッダー: 種目名 + 削除 */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
            <span style={{ fontSize: 16, fontWeight: 700, color: C.text }}>{exerciseName}</span>
            <button
              onClick={onRemove}
              style={{
                background: "none", border: "none", color: C.danger,
                fontSize: 13, cursor: "pointer", padding: "4px 8px",
              }}
            >
              ×削除
            </button>
          </div>

          {/* 前回記録 */}
          <PreviousRecord db={db} exerciseId={exerciseId} currentDate={currentDate} />

          {/* PR（自己ベスト）表示 */}
          {(() => {
            const pr = findPR(db.sets, exerciseId);
            if (!pr) return null;
            const prWorkout = db.workouts.find((w) => w.id === pr.workoutId);
            const prDateStr = prWorkout ? formatDateJP(prWorkout.date).replace(/（.+）$/, "") : "";
            return (
              <div style={{ fontSize: 12, color: C.prBadge, marginBottom: 6, fontWeight: 600 }}>
                PR: {pr.weight}kg × {pr.reps}{prDateStr ? `（${prDateStr}）` : ""}
              </div>
            );
          })()}

          {/* 区切り線 */}
          <div style={{ borderTop: `1px solid ${C.border}`, marginBottom: 8 }} />

          {/* セット行 */}
          {setsData.map((s) => (
            <SetRow
              key={s.id}
              set={s}
              onUpdate={(id, updates) => db.updateSet(id, updates)}
              onDelete={(id) => db.deleteSet(id)}
              isPR={isPRSet(s, db.sets, exerciseId)}
            />
          ))}

          {/* セット追加ボタン */}
          <button
            onClick={handleAddSet}
            style={{
              width: "100%", padding: "10px 0", marginTop: 4,
              background: "none", border: `1px dashed ${C.border}`, borderRadius: 6,
              color: C.accent, fontSize: 14, fontWeight: 600, cursor: "pointer",
            }}
          >
            + セット追加
          </button>

          {/* 推定1RM表示（Big3のみ） */}
          {BIG3_NAMES.includes(exerciseName) && (() => {
            const current1RM = getWorkoutE1RM(setsData);
            if (!current1RM) return null;
            // 前回の推定1RMを算出
            const prev = db.getPreviousRecord(exerciseId, currentDate);
            const prev1RM = prev ? getWorkoutE1RM(prev.sets.map((s) => ({ weight: s.weight, reps: s.reps }))) : null;
            const diff = prev1RM ? Math.round((current1RM - prev1RM) * 10) / 10 : null;
            return (
              <div style={{
                marginTop: 8, padding: "6px 10px",
                background: "#F0F9FF", borderRadius: 6, fontSize: 13, lineHeight: 1.6,
              }}>
                <span style={{ fontWeight: 600, color: C.text }}>推定1RM: {current1RM.toFixed(1)}kg</span>
                {prev1RM && diff !== null && (
                  <span style={{ color: C.sub, marginLeft: 8 }}>
                    （前回: {prev1RM.toFixed(1)}kg →{" "}
                    <span style={{ color: diff > 0 ? "#059669" : diff < 0 ? C.danger : C.sub, fontWeight: 600 }}>
                      {diff > 0 ? "+" : ""}{diff.toFixed(1)}kg
                    </span>
                    ）
                  </span>
                )}
              </div>
            );
          })()}

          {/* 種目メモ */}
          <input
            type="text"
            value={memo}
            onChange={(e) => setMemo(e.target.value)}
            onBlur={handleMemoBlur}
            placeholder="種目メモ（例: フォーム意識）"
            style={{
              width: "100%", marginTop: 8, padding: "8px 10px",
              border: `1px solid ${C.border}`, borderRadius: 6,
              fontSize: 14, color: C.text, background: C.bg, boxSizing: "border-box",
            }}
          />
        </div>
      );
    }

    // ============================================================
    // コンポーネント: 種目選択ダイアログ（設計書 セクション8）

    function ExercisePickerModal({ db, alreadyAddedIds, onSelect, onClose }) {

      const added = db.activeExercises.filter((e) => alreadyAddedIds.includes(e.id));

      return (
        <div style={{
          position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)",
          display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 100,
        }}
          onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
        >
          <div style={{
            width: "100%", maxWidth: 480, maxHeight: "70vh",
            background: C.bg, borderRadius: "16px 16px 0 0",
            padding: "20px 16px", overflowY: "auto",
          }}>
            <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 16, color: C.text }}>種目を選択</div>

            {available.length === 0 && (
              <div style={{ fontSize: 14, color: C.sub, padding: "16px 0", textAlign: "center" }}>
                すべての種目が追加済みです
              </div>
            )}

            {available.map((ex) => (
              <button
                key={ex.id}

                style={{
                  display: "block", width: "100%", textAlign: "left",
                  padding: "14px 12px", marginBottom: 4,
                  background: C.cardBg, border: `1px solid ${C.border}`, borderRadius: 8,
                  fontSize: 15, color: C.text, cursor: "pointer",
                }}
              >
                {ex.name}
              </button>
            ))}

            {/* 追加済みはグレーアウト */}
            {added.map((ex) => (
              <div
                key={ex.id}
                style={{
                  padding: "14px 12px", marginBottom: 4,
                  background: "#F3F4F6", border: `1px solid ${C.border}`, borderRadius: 8,
                  fontSize: 15, color: "#D1D5DB",
                }}
              >
                {ex.name}（追加済み）
              </div>
            ))}

            <button
              onClick={onClose}
              style={{
                width: "100%", padding: "14px 0", marginTop: 12,
                background: "none", border: `1px solid ${C.border}`, borderRadius: 8,
                fontSize: 15, color: C.sub, cursor: "pointer", fontWeight: 600,
              }}
            >
              キャンセル
            </button>
          </div>
        </div>
      );
    }

    // ============================================================
    // コンポーネント: 日付セレクター（DateSelector）

    function DateSelector({ date, onChange }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
          <span style={{ fontSize: 18, fontWeight: 700, color: C.text }}>{formatDateJP(date)}</span>
          <input
            type="date"
            value={date}
            onChange={(e) => onChange(e.target.value)}
            style={{
              padding: "6px 10px", border: `1px solid ${C.border}`, borderRadius: 6,
              fontSize: 13, color: C.accent, cursor: "pointer", background: C.bg,

          />
        </div>
      );

    // ============================================================
    // 画面: 今日の記録（RecordScreen）— 設計書 2-2
    // ============================================================
    function RecordScreen({ db }) {
      const [currentDate, setCurrentDate] = useState(todayStr());
      const [showPicker, setShowPicker] = useState(false);
      const [showTemplatePicker, setShowTemplatePicker] = useState(false);
      const [bodyWeightInput, setBodyWeightInput] = useState("");
      const [memoInput, setMemoInput] = useState("");
      const [initialized, setInitialized] = useState(false);

      // Workout を自動作成（同一日付は1レコード）
      const workout = db.getWorkoutByDate(currentDate);

      // 日付変更時に Workout を自動作成 & フィールド同期
      const ensureWorkout = () => {
        const w = db.getOrCreateWorkout(currentDate);
        return w;
      };

      // Workout の体重・メモをローカル state に同期
      if (workout && !initialized) {
        if (workout.bodyWeight !== null && bodyWeightInput === "") {
          setBodyWeightInput(String(workout.bodyWeight));
        }
        if (workout.memo && memoInput === "") {
          setMemoInput(workout.memo);
        }
        setInitialized(true);
      }

      const handleDateChange = (newDate) => {
        setCurrentDate(newDate);
        setInitialized(false);
        const w = db.getWorkoutByDate(newDate);
        if (w) {
          setBodyWeightInput(w.bodyWeight !== null ? String(w.bodyWeight) : "");
          setMemoInput(w.memo || "");
        } else {
          setBodyWeightInput("");
          setMemoInput("");
        }
      };

      const handleBodyWeightBlur = () => {
        const w = ensureWorkout();
        if (!w) return;
        const v = parseFloat(bodyWeightInput);
        if (!isNaN(v) && v > 0) {
          db.updateWorkout(w.id, { bodyWeight: v });
        } else if (bodyWeightInput === "") {
          db.updateWorkout(w.id, { bodyWeight: null });
        }
      };

      const handleMemoBlur = () => {
        const w = ensureWorkout();
        if (!w) return;
        db.updateWorkout(w.id, { memo: memoInput });
      };

      const handleSelectExercise = (exerciseId) => {
        const w = ensureWorkout();
        if (!w) return;
        // 最初のセット（空のセット行）を追加
        db.addSet(w.id, exerciseId, 0, 0, "");
      };

      const exercisesInWorkout = workout ? db.getExercisesInWorkout(workout.id) : [];
      const addedExerciseIds = exercisesInWorkout.map((e) => e.exerciseId);

      return (
        <div style={{ paddingBottom: 80 }}>
          {/* 日付 */}
          <DateSelector date={currentDate} onChange={handleDateChange} />

          {/* 体重 */}
          <div style={{
            display: "flex", alignItems: "center", gap: 8,
            marginBottom: 8, padding: "8px 12px",
            background: C.cardBg, borderRadius: 8, border: `1px solid ${C.border}`,
          }}>
            <span style={{ fontSize: 14, color: C.sub, flexShrink: 0 }}>体重</span>
            <input
              type="number"
              inputMode="decimal"
              step="0.1"
              value={bodyWeightInput}
              onChange={(e) => setBodyWeightInput(e.target.value)}
              onBlur={handleBodyWeightBlur}
              placeholder="72.5"
              style={{
                width: 80, height: 40, padding: "0 8px",
                border: `1px solid ${C.border}`, borderRadius: 6,
                fontSize: 18, textAlign: "center", background: C.bg,
              }}
            />
            <span style={{ fontSize: 14, color: C.sub }}>kg</span>
          </div>

          {/* 当日メモ */}
          <div style={{
            marginBottom: 16, padding: "8px 12px",
            background: C.cardBg, borderRadius: 8, border: `1px solid ${C.border}`,
          }}>
            <input
              type="text"
              value={memoInput}
              onChange={(e) => setMemoInput(e.target.value)}
              onBlur={handleMemoBlur}
              placeholder="当日メモ（例: 睡眠不足、調子良い）"
              style={{
                width: "100%", height: 40, padding: "0 8px",
                border: "none", fontSize: 14, color: C.text,
                background: "transparent", outline: "none", boxSizing: "border-box",
              }}
            />
          </div>

          {/* 種目ブロック一覧 */}
          {exercisesInWorkout.map((exGroup) => (
            <ExerciseBlock
              key={exGroup.exerciseId}
              db={db}
              workoutId={workout.id}
              exerciseId={exGroup.exerciseId}
              exerciseName={exGroup.exerciseName}
              currentDate={currentDate}
              setsData={exGroup.sets}
              onRemove={() => db.removeExerciseFromWorkout(workout.id, exGroup.exerciseId)}
            />
          ))}

          {/* 種目追加ボタン + テンプレから追加ボタン */}
          <div style={{ display: "flex", gap: 8 }}>
            <button
              onClick={() => setShowPicker(true)}
              style={{
                flex: 1, padding: "14px 0",
                background: C.accent, color: "#FFFFFF", border: "none", borderRadius: 10,
                fontSize: 15, fontWeight: 700, cursor: "pointer",
              }}
            >
              + 種目を追加
            </button>
            {db.templates.length > 0 && (
              <button
                onClick={() => setShowTemplatePicker(true)}
                style={{
                  padding: "14px 12px",
                  background: "none", color: C.accent,
                  border: `1px solid ${C.accent}`, borderRadius: 10,
                  fontSize: 13, fontWeight: 600, cursor: "pointer",
                  whiteSpace: "nowrap",
                }}
              >
                テンプレ
              </button>
            )}
          </div>

          {/* 現在のメニューをテンプレに保存リンク */}
          {exercisesInWorkout.length > 0 && (
            <div style={{ textAlign: "center", marginTop: 10 }}>
              <button
                onClick={() => {
                  const name = prompt("テンプレート名を入力してください（例: 胸の日）");
                  if (!name || !name.trim()) return;
                  if (db.templates.length >= 10) {
                    alert("テンプレートは最大10個までです");
                    return;
                  }
                  const exerciseIds = exercisesInWorkout.map((e) => e.exerciseId);
                  db.addTemplate(name.trim(), exerciseIds);
                  alert("テンプレートを保存しました");
                }}
                style={{
                  background: "none", border: "none",
                  color: C.sub, fontSize: 13, cursor: "pointer",
                  textDecoration: "underline",
                }}
              >
                現在のメニューをテンプレに保存
              </button>
            </div>
          )}

          {/* 種目選択モーダル */}
          {showPicker && (
            <ExercisePickerModal
              db={db}
              alreadyAddedIds={addedExerciseIds}
              onSelect={handleSelectExercise}
              onClose={() => setShowPicker(false)}
            />
          )}

          {/* テンプレート選択モーダル */}
          {showTemplatePicker && (
            <TemplatePickerModal
              db={db}
              onApply={(tpl) => {
                const w = ensureWorkout();
                if (!w) return;
                let addedCount = 0;
                tpl.exerciseIds.forEach((exId) => {
                  // 論理削除された種目はスキップ
                  const ex = db.exercises.find((e) => e.id === exId);
                  if (!ex || !ex.isActive) return;
                  // 既に追加済みの種目はスキップ
                  if (addedExerciseIds.includes(exId)) return;
                  db.addSet(w.id, exId, 0, 0, "");
                  addedCount++;
                });
              }}
              onClose={() => setShowTemplatePicker(false)}
            />
          )}
        </div>
      );
    }

    // コンポーネント: 日別アコーディオン（WorkoutAccordion）

              justifyContent: "space-between", padding: "12px 14px",

              border: "none", cursor: "pointer", textAlign: "left",

            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>

                {isOpen ? "▼" : "▶"}
              </span>

                {formatDateJP(workout.date)}
              </span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              {workout.bodyWeight !== null && (
                <span style={{ fontSize: 13, color: C.sub }}>

                </span>

                  fontSize: 11, color: C.sub, background: "#F3F4F6",
                  borderRadius: 10, padding: "2px 8px",

                  {exerciseGroups.length}種目

                <div style={{ fontSize: 13, color: C.sub, padding: "8px 0" }}>

                </div>
