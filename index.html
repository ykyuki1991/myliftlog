    // ============================================================
    // 画面: 履歴（HistoryScreen）— 設計書 2-3
    // ============================================================
    function HistoryScreen({ db }) {
      const [openIds, setOpenIds] = useState({});
      const [filterExerciseId, setFilterExerciseId] = useState("");

      const toggleOpen = (id) =>
        setOpenIds((prev) => ({ ...prev, [id]: !prev[id] }));

      // 日付降順でソート
      const sortedWorkouts = useMemo(
        () => [...db.workouts].sort((a, b) => (b.date > a.date ? 1 : b.date < a.date ? -1 : 0)),
        [db.workouts]
      );

      // 各 Workout の種目グループを取得（フィルタ適用）
      const workoutsWithGroups = useMemo(() => {
        return sortedWorkouts.map((w) => {
          let groups = db.getExercisesInWorkout(w.id);
          if (filterExerciseId) {
            groups = groups.filter((g) => g.exerciseId === filterExerciseId);
          }
          return { workout: w, groups };
        });
      }, [sortedWorkouts, db, filterExerciseId]);

      // フィルタ適用時: 該当する種目を含む Workout のみ表示
      const visibleWorkouts = filterExerciseId
        ? workoutsWithGroups.filter((wg) => wg.groups.length > 0)
        : workoutsWithGroups;

      // Big3サマリ: 各種目の直近5回分の推定1RM推移
      const big3Summary = useMemo(() => {
        return BIG3_NAMES.map((name) => {
          const ex = db.exercises.find((e) => e.name === name && e.isActive);
          if (!ex) return { name, data: [] };
          // 日付降順で全ワークアウトを走査し、この種目のセットがあるものを集める
          const data = [];
          for (const w of sortedWorkouts) {
            const wSets = db.sets
              .filter((s) => s.workoutId === w.id && s.exerciseId === ex.id && (s.weight > 0 && s.reps > 0));
            if (wSets.length === 0) continue;
            const e1rm = getWorkoutE1RM(wSets);
            if (e1rm) data.push({ date: w.date, e1rm });
            if (data.length >= 5) break;
          }
          return { name, data: data.reverse() }; // 古い順に並べる
        });
      }, [sortedWorkouts, db.exercises, db.sets]);

      const hasBig3Data = big3Summary.some((b) => b.data.length > 0);

      return (
        <div style={{ paddingBottom: 80 }}>
          <div style={{ fontSize: 18, fontWeight: 700, color: C.text, marginBottom: 12 }}>
            トレーニング履歴
          </div>

          {/* Big3サマリ */}
          {hasBig3Data && (
            <div style={{
              marginBottom: 14, padding: "12px 14px",
              background: C.cardBg, borderRadius: 10, border: `1px solid ${C.border}`,
            }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: C.text, marginBottom: 8 }}>Big3 推定1RM推移</div>
              {big3Summary.map((item) => {
                if (item.data.length === 0) return null;
                return (
                  <div key={item.name} style={{ marginBottom: 6 }}>
                    <span style={{ fontSize: 12, color: C.sub, display: "inline-block", width: 90 }}>{item.name}</span>
                    <span style={{ fontSize: 13, color: C.text, fontWeight: 500 }}>
                      {item.data.map((d, i) => (
                        <span key={i}>
                          {i > 0 && <span style={{ color: C.sub, margin: "0 3px" }}>→</span>}
                          <span style={i === item.data.length - 1 ? { fontWeight: 700, color: C.accent } : {}}>
                            {d.e1rm.toFixed(1)}
                          </span>
                        </span>
                      ))}
                    </span>
                  </div>
                );
              })}
            </div>
          )}

          {/* 週間ボリューム集計 */}
          {(() => {
            const week = getWeekRange();
            const weekWorkouts = db.workouts.filter((w) => w.date >= week.start && w.date <= week.end);
            const volumeByGroup = {};
            MUSCLE_GROUPS.forEach((g) => { volumeByGroup[g] = 0; });
            weekWorkouts.forEach((w) => {
              const exGroups = db.getExercisesInWorkout(w.id);
              exGroups.forEach((exGroup) => {
                const ex = db.exercises.find((e) => e.id === exGroup.exerciseId);
                if (!ex || !ex.muscleGroup) return;
                const validSets = exGroup.sets.filter((s) => s.weight > 0 && s.reps > 0);
                volumeByGroup[ex.muscleGroup] = (volumeByGroup[ex.muscleGroup] || 0) + validSets.length;
              });
            });
            const maxSets = Math.max(...Object.values(volumeByGroup), 1);
            return (
              <div style={{
                marginBottom: 14, padding: "12px 14px",
                background: C.cardBg, borderRadius: 10, border: `1px solid ${C.border}`,
              }}>
                <div style={{ fontSize: 14, fontWeight: 700, color: C.text, marginBottom: 8 }}>
                  今週のボリューム
                  <span style={{ fontSize: 11, fontWeight: 400, color: C.sub, marginLeft: 8 }}>
                    {week.start.slice(5).replace("-", "/")}〜{week.end.slice(5).replace("-", "/")}
                  </span>
                </div>
                {MUSCLE_GROUPS.map((g) => (
                  <div key={g} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                    <span style={{ fontSize: 12, color: C.sub, width: 32, flexShrink: 0 }}>{g}</span>
                    <div style={{ flex: 1, height: 16, background: "#F3F4F6", borderRadius: 4, overflow: "hidden" }}>
                      <div style={{
                        width: `${Math.max((volumeByGroup[g] / maxSets) * 100, 0)}%`,
                        height: "100%", background: volumeByGroup[g] > 0 ? C.accent : "transparent",
                        borderRadius: 4, transition: "width 0.3s",
                      }} />
                    </div>
                    <span style={{ fontSize: 12, color: C.text, fontWeight: 600, width: 48, textAlign: "right", flexShrink: 0 }}>
                      {volumeByGroup[g]}セット
                    </span>
                  </div>
                ))}
              </div>
            );
          })()}

          {/* 種目フィルター */}
          <div style={{
            marginBottom: 14, padding: "8px 12px",
            background: C.cardBg, borderRadius: 8, border: `1px solid ${C.border}`,
            display: "flex", alignItems: "center", gap: 8,
          }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke={C.sub} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <select
              value={filterExerciseId}
              onChange={(e) => setFilterExerciseId(e.target.value)}
              style={{
                flex: 1, padding: "6px 4px", border: "none", background: "transparent",
                fontSize: 14, color: C.text, cursor: "pointer", outline: "none",
              }}
            >
              <option value="">すべての種目</option>
              {db.activeExercises.map((ex) => (
                <option key={ex.id} value={ex.id}>{ex.name}</option>
              ))}
            </select>
            {filterExerciseId && (
              <button
                onClick={() => setFilterExerciseId("")}
                style={{
                  background: "none", border: "none", color: C.danger,
                  fontSize: 16, cursor: "pointer", padding: "0 4px",
                }}
              >
                ×
              </button>
            )}
          </div>

          {/* 履歴一覧 */}
          {visibleWorkouts.length === 0 ? (
            <div style={{
              textAlign: "center", padding: "40px 0", color: C.sub, fontSize: 14,
            }}>
              {db.workouts.length === 0
                ? "まだトレーニング記録がありません"
                : "該当する記録がありません"}
            </div>
          ) : (
            visibleWorkouts.map(({ workout, groups }) => (
              <WorkoutAccordion
                key={workout.id}
                workout={workout}
                exerciseGroups={groups}
                isOpen={!!openIds[workout.id]}
                onToggle={() => toggleOpen(workout.id)}
                allSets={db.sets}
              />
            ))
          )}

          {/* 件数表示 */}
          {db.workouts.length > 0 && (
            <div style={{
              textAlign: "center", padding: "12px 0", fontSize: 12, color: C.sub,
            }}>
              {filterExerciseId
                ? `${visibleWorkouts.length}件 / 全${db.workouts.length}件`
                : `全${db.workouts.length}件`}
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // コンポーネント: 種目管理（ExerciseManager）— 設計書 2-4
    // ============================================================
    function ExerciseManager({ db }) {
      const [newName, setNewName] = useState("");
      const [newMuscleGroup, setNewMuscleGroup] = useState("胸");
      const [editingId, setEditingId] = useState(null);
      const [editingName, setEditingName] = useState("");
      const [editingMuscleGroup, setEditingMuscleGroup] = useState("胸");
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);

      const handleAdd = () => {
        const trimmed = newName.trim();
        if (!trimmed) return;
        // 重複チェック
        if (db.activeExercises.some((e) => e.name === trimmed)) return;
        db.addExercise(trimmed, newMuscleGroup);
        setNewName("");
        setNewMuscleGroup("胸");
      };

      const startEdit = (ex) => {
        setEditingId(ex.id);
        setEditingName(ex.name);
        setEditingMuscleGroup(ex.muscleGroup || "胸");
      };

      const saveEdit = () => {
        const trimmed = editingName.trim();
        if (!trimmed || !editingId) { setEditingId(null); return; }
        // 重複チェック（自分自身は除外）
        if (db.activeExercises.some((e) => e.id !== editingId && e.name === trimmed)) {
          setEditingId(null);
          return;
        }
        db.updateExercise(editingId, { name: trimmed, muscleGroup: editingMuscleGroup });
        setEditingId(null);
      };

      const handleDelete = (ex) => {
        // 過去記録があるか確認
        const hasRecords = db.sets.some((s) => s.exerciseId === ex.id);
        if (hasRecords) {
          setConfirmDeleteId(ex.id);
        } else {
          db.deleteExercise(ex.id);
        }
      };

      const confirmDelete = () => {
        if (confirmDeleteId) {
          db.deleteExercise(confirmDeleteId);
          setConfirmDeleteId(null);
        }
      };

      const deleteTarget = confirmDeleteId
        ? db.exercises.find((e) => e.id === confirmDeleteId)
        : null;

      return (
        <div style={{ marginBottom: 24 }}>
          <div style={{ fontSize: 16, fontWeight: 700, color: C.text, marginBottom: 12 }}>種目管理</div>

          {/* 種目一覧 */}
          <div style={{ marginBottom: 12 }}>
            {db.activeExercises.map((ex) => (
              <div
                key={ex.id}
                style={{
                  display: "flex", alignItems: "center", gap: 8,
                  padding: "10px 12px", marginBottom: 4,
                  background: C.cardBg, borderRadius: 8, border: `1px solid ${C.border}`,
                }}
              >
                {editingId === ex.id ? (
                  <div style={{ display: "flex", flexDirection: "column", gap: 6, width: "100%" }}>
                    <div style={{ display: "flex", gap: 6 }}>
                      <input
                        type="text"
                        value={editingName}
                        onChange={(e) => setEditingName(e.target.value)}
                        onKeyDown={(e) => { if (e.key === "Enter") saveEdit(); }}
                        autoFocus
                        style={{
                          flex: 1, padding: "6px 8px",
                          border: `1px solid ${C.accent}`, borderRadius: 6,
                          fontSize: 14, color: C.text,
                        }}
                      />
                      <select
                        value={editingMuscleGroup}
                        onChange={(e) => setEditingMuscleGroup(e.target.value)}
                        style={{
                          padding: "6px 8px", border: `1px solid ${C.accent}`, borderRadius: 6,
                          fontSize: 12, color: C.text, background: C.bg,
                        }}
                      >
                        {MUSCLE_GROUPS.map((g) => <option key={g} value={g}>{g}</option>)}
                      </select>
                    </div>
                    <div style={{ display: "flex", gap: 6, justifyContent: "flex-end" }}>
                      <button
                        onClick={() => setEditingId(null)}
                        style={{
                          padding: "6px 8px", background: "none",
                          border: `1px solid ${C.border}`, borderRadius: 6,
                          fontSize: 12, color: C.sub, cursor: "pointer",
                        }}
                      >
                        取消
                      </button>
                      <button
                        onClick={saveEdit}
                        style={{
                          padding: "6px 12px", background: C.accent, color: "#fff",
                          border: "none", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: "pointer",
                        }}
                      >
                        保存
                      </button>
                    </div>
                  </div>
                ) : (
                  <>
                    <span style={{ flex: 1, fontSize: 14, color: C.text }}>
                      {ex.name}
                      <span style={{ fontSize: 11, color: C.sub, marginLeft: 6 }}>({ex.muscleGroup || "未設定"})</span>
                    </span>
                    <button
                      onClick={() => startEdit(ex)}
                      style={{
                        padding: "4px 10px", background: "none",
                        border: `1px solid ${C.border}`, borderRadius: 6,
                        fontSize: 12, color: C.sub, cursor: "pointer",
                      }}
                    >
                      編集
                    </button>
                    <button
                      onClick={() => handleDelete(ex)}
                      style={{
                        padding: "4px 10px", background: "none",
                        border: `1px solid ${C.border}`, borderRadius: 6,
                        fontSize: 12, color: C.danger, cursor: "pointer",
                      }}
                    >
                      ×
                    </button>
                  </>
                )}
              </div>
            ))}
          </div>

          {/* 種目追加 */}
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <input
              type="text"
              value={newName}
              onChange={(e) => setNewName(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") handleAdd(); }}
              placeholder="新しい種目名"
              style={{
                flex: 1, minWidth: 120, padding: "10px 12px",
                border: `1px solid ${C.border}`, borderRadius: 8,
                fontSize: 14, color: C.text,
              }}
            />
            <select
              value={newMuscleGroup}
              onChange={(e) => setNewMuscleGroup(e.target.value)}
              style={{
                padding: "10px 8px", border: `1px solid ${C.border}`, borderRadius: 8,
                fontSize: 14, color: C.text, background: C.bg,
              }}
            >
              {MUSCLE_GROUPS.map((g) => <option key={g} value={g}>{g}</option>)}
            </select>
            <button
              onClick={handleAdd}
              style={{
                padding: "10px 18px", background: C.accent, color: "#fff",
                border: "none", borderRadius: 8, fontSize: 14, fontWeight: 600, cursor: "pointer",
              }}
            >
              + 追加
            </button>
          </div>

          {/* 削除確認ダイアログ（過去記録あり） */}
          {confirmDeleteId && deleteTarget && (
            <div style={{
              position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)",
              display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100,
            }}>
              <div style={{
                background: C.bg, borderRadius: 12, padding: 24, width: "90%", maxWidth: 340,
              }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: C.text, marginBottom: 12 }}>
                  種目を削除しますか？
                </div>
                <div style={{ fontSize: 13, color: C.sub, marginBottom: 20, lineHeight: 1.6 }}>
                  「{deleteTarget.name}」には過去のトレーニング記録があります。
                  種目マスタから非表示になりますが、過去の記録は保持されます。
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button
                    onClick={() => setConfirmDeleteId(null)}
                    style={{
                      flex: 1, padding: "12px 0",
                      background: "none", border: `1px solid ${C.border}`, borderRadius: 8,
                      fontSize: 14, color: C.sub, cursor: "pointer",
                    }}
                  >
                    キャンセル
                  </button>
                  <button
                    onClick={confirmDelete}
                    style={{
                      flex: 1, padding: "12px 0",
                      background: C.danger, color: "#fff", border: "none", borderRadius: 8,
                      fontSize: 14, fontWeight: 600, cursor: "pointer",
                    }}
                  >
                    削除する
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // コンポーネント: CSVエクスポート（CsvExportButton）— 設計書セクション5
    // ============================================================
    function CsvExportButton({ db }) {
      const [exported, setExported] = useState(false);

      const handleExport = () => {
        // データなしチェック（エラーハンドリング: 設計書セクション9）
        if (db.workouts.length === 0) {
          alert("エクスポートするデータがありません");
          return;
        }

        // ヘッダー行
        const header = "日付,体重(kg),当日メモ,種目名,部位,セット番号,重量(kg),回数,種目メモ";

        // 日付の降順で出力
        const sortedWorkouts = [...db.workouts].sort((a, b) =>
          b.date > a.date ? 1 : b.date < a.date ? -1 : 0
        );

        const rows = [];
        sortedWorkouts.forEach((w) => {
          const exGroups = db.getExercisesInWorkout(w.id);
          if (exGroups.length === 0) {
            // 種目なし（体重・メモのみの日）
            rows.push(csvRow([w.date, w.bodyWeight, w.memo, "", "", "", "", "", ""]));
          } else {
            // 同一日内は種目の追加順、セット順で出力
            exGroups.forEach((exGroup) => {
              const validSets = exGroup.sets.filter((s) => s.weight > 0 || s.reps > 0);
              if (validSets.length === 0) return;
              const ex = db.exercises.find((e) => e.id === exGroup.exerciseId);
              const muscleGroup = ex ? (ex.muscleGroup || "") : "";
              validSets.forEach((s) => {
                rows.push(csvRow([
                  w.date,
                  w.bodyWeight !== null ? w.bodyWeight : "",
                  w.memo || "",
                  exGroup.exerciseName,
                  muscleGroup,
                  s.setOrder,
                  s.weight,
                  s.reps,
                  s.memo || "",
                ]));
              });
            });
          }
        });

        const csvContent = header + "\n" + rows.join("\n");

        // UTF-8 BOM付き（設計書: Excelでの文字化け防止）
        const bom = "\uFEFF";
        const blob = new Blob([bom + csvContent], { type: "text/csv;charset=utf-8;" });

        // ファイル名: myliftlog_YYYYMMDD.csv
        const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, "");
        const fileName = `myliftlog_${dateStr}.csv`;

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        localStorage.setItem("myliftlog_last_export", new Date().toISOString());

        setExported(true);
        setTimeout(() => setExported(false), 3000);
      };

      return (
        <button
          onClick={handleExport}
          style={{
            width: "100%", padding: "14px 0",
            background: exported ? "#059669" : C.accent, color: "#fff",
            border: "none", borderRadius: 8,
            fontSize: 14, fontWeight: 600, cursor: "pointer",
            transition: "background 0.2s",
          }}
        >
          {exported ? "エクスポート完了" : "CSVエクスポート"}
        </button>
      );
    }

    // CSVフィールドのエスケープ
    function csvRow(fields) {
      return fields
        .map((f) => {
          const s = String(f ?? "");
          if (s.includes(",") || s.includes('"') || s.includes("\n")) {
            return '"' + s.replace(/"/g, '""') + '"';
          }
          return s;
        })
        .join(",");
    }

    // ============================================================
    // コンポーネント: CSVインポート（CsvImportButton）
    // ============================================================
    function CsvImportButton({ db }) {
      const [step, setStep] = useState("idle");
      // steps: idle → modeSelect → fileSelect → confirm → done
      const [mode, setMode] = useState(null); // "overwrite" | "append"
      const [parsedRows, setParsedRows] = useState([]);
      const [summary, setSummary] = useState(null); // { days, sets, skipped }
      const [error, setError] = useState(null);

      const HEADER_NEW = "日付,体重(kg),当日メモ,種目名,部位,セット番号,重量(kg),回数,種目メモ";
      const HEADER_OLD = "日付,体重(kg),当日メモ,種目名,セット番号,重量(kg),回数,種目メモ";

      const resetState = () => {
        setStep("idle");
        setMode(null);
        setParsedRows([]);
        setSummary(null);
        setError(null);
      };

      const handleModeSelect = (selectedMode) => {
        setMode(selectedMode);
        if (selectedMode === "overwrite") {
          // 上書きモードは追加警告を出してからファイル選択へ
          setStep("overwriteWarn");
        } else {
          setStep("fileSelect");
        }
      };

      const handleOverwriteConfirm = () => {
        setStep("fileSelect");
      };

      const parseCSV = (text) => {
        // BOM除去
        const content = text.replace(/^\uFEFF/, "");
        const lines = content.split(/\r?\n/).filter((l) => l.trim());
        if (lines.length < 2) {
          setError("データが含まれていません");
          return;
        }

        // ヘッダー検証（新旧両対応）
        const header = lines[0].trim();
        let hasMuscleGroup = false;
        if (header === HEADER_NEW) {
          hasMuscleGroup = true;
        } else if (header !== HEADER_OLD) {
          setError("このファイルはインポートできません（カラム構成が一致しません）");
          return;
        }

        // CSVパース（ダブルクォート対応）
        const parseCSVLine = (line) => {
          const fields = [];
          let current = "";
          let inQuotes = false;
          for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (inQuotes) {
              if (ch === '"' && line[i + 1] === '"') {
                current += '"';
                i++;
              } else if (ch === '"') {
                inQuotes = false;
              } else {
                current += ch;
              }
            } else {
              if (ch === '"') {
                inQuotes = true;
              } else if (ch === ",") {
                fields.push(current);
                current = "";
              } else {
                current += ch;
              }
            }
          }
          fields.push(current);
          return fields;
        };

        const minCols = hasMuscleGroup ? 9 : 8;
        const rows = [];
        for (let i = 1; i < lines.length; i++) {
          const fields = parseCSVLine(lines[i]);
          if (fields.length < minCols) continue;
          // 日付の基本検証
          if (!/^\d{4}-\d{2}-\d{2}$/.test(fields[0])) continue;
          if (hasMuscleGroup) {
            rows.push({
              date: fields[0], bodyWeight: fields[1], workoutMemo: fields[2],
              exerciseName: fields[3], muscleGroup: fields[4],
              setNumber: fields[5], weight: fields[6], reps: fields[7], exerciseMemo: fields[8],
            });
          } else {
            rows.push({
              date: fields[0], bodyWeight: fields[1], workoutMemo: fields[2],
              exerciseName: fields[3], muscleGroup: "",
              setNumber: fields[4], weight: fields[5], reps: fields[6], exerciseMemo: fields[7],
            });
          }
        }

        if (rows.length === 0) {
          setError("インポート可能なデータがありません");
          return;
        }

        // 集計
        const dates = [...new Set(rows.map((r) => r.date))];
        const setsCount = rows.filter((r) => r.exerciseName).length;

        // 追加モードの場合、スキップされる日数を計算
        let skippedDays = 0;
        if (mode === "append") {
          dates.forEach((date) => {
            if (db.workouts.some((w) => w.date === date)) {
              skippedDays++;
            }
          });
        }

        setParsedRows(rows);
        setSummary({
          days: dates.length,
          sets: setsCount,
          skipped: skippedDays,
          importDays: dates.length - skippedDays,
        });
        setStep("confirm");
      };

      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          parseCSV(ev.target.result);
        };
        reader.readAsText(file, "UTF-8");
      };

      const handleExecute = () => {
        db.importData(parsedRows, mode);
        setStep("done");
      };

      // ファイル入力の ref
      const fileInputRef = useRef(null);

      // fileSelect ステップに入ったらファイル選択を開く
      useEffect(() => {
        if (step === "fileSelect" && fileInputRef.current) {
          fileInputRef.current.click();
        }
      }, [step]);

      return (
        <>
          {/* 非表示のファイル入力 */}
          <input
            ref={fileInputRef}
            type="file"
            accept=".csv"
            style={{ display: "none" }}
            onChange={handleFileChange}
            onClick={(e) => { e.target.value = ""; }}
          />

          <button
            onClick={() => setStep("modeSelect")}
            style={{
              width: "100%", padding: "14px 0",
              background: "none", color: C.accent,
              border: `1px solid ${C.accent}`, borderRadius: 8,
              fontSize: 14, fontWeight: 600, cursor: "pointer",
            }}
          >
            CSVインポート
          </button>

          {/* エラーダイアログ */}
          {error && (
            <div style={{
              position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)",
              display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100,
            }}>
              <div style={{
                background: C.bg, borderRadius: 12, padding: 24, width: "90%", maxWidth: 340,
              }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: C.danger, marginBottom: 12 }}>
                  インポートエラー
                </div>
                <div style={{ fontSize: 14, color: C.text, marginBottom: 20, lineHeight: 1.6 }}>
                  {error}
                </div>
                <button
                  onClick={resetState}
                  style={{
                    width: "100%", padding: "12px 0",
                    background: C.accent, color: "#fff", border: "none", borderRadius: 8,
                    fontSize: 14, fontWeight: 600, cursor: "pointer",
                  }}
                >
                  OK
                </button>
              </div>
            </div>
          )}

          {/* モード選択ダイアログ */}
          {step === "modeSelect" && (
            <div style={{
              position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)",
              display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100,
            }}>
              <div style={{
                background: C.bg, borderRadius: 12, padding: 24, width: "90%", maxWidth: 340,
              }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: C.text, marginBottom: 16 }}>
                  インポートモードを選択
                </div>
                <button
                  onClick={() => handleModeSelect("overwrite")}
                  style={{
                    width: "100%", padding: "14px 12px", marginBottom: 8,
                    background: C.cardBg, border: `1px solid ${C.border}`, borderRadius: 8,
                    fontSize: 14, color: C.text, cursor: "pointer", textAlign: "left",
                  }}
                >
                  <div style={{ fontWeight: 600 }}>上書きモード</div>
                  <div style={{ fontSize: 12, color: C.sub, marginTop: 4 }}>
                    既存データを全削除してからインポート
                  </div>
                </button>
                <button
                  onClick={() => handleModeSelect("append")}
                  style={{
                    width: "100%", padding: "14px 12px", marginBottom: 12,
                    background: C.cardBg, border: `1px solid ${C.border}`, borderRadius: 8,
                    fontSize: 14, color: C.text, cursor: "pointer", textAlign: "left",
                  }}
                >
                  <div style={{ fontWeight: 600 }}>追加モード</div>
                  <div style={{ fontSize: 12, color: C.sub, marginTop: 4 }}>
                    既存データを残したまま追記（同一日付はスキップ）
                  </div>
                </button>
                <button
                  onClick={resetState}
                  style={{
                    width: "100%", padding: "12px 0",
                    background: "none", border: `1px solid ${C.border}`, borderRadius: 8,
                    fontSize: 14, color: C.sub, cursor: "pointer",
                  }}
                >
                  キャンセル
                </button>
              </div>
            </div>
          )}

          {/* 上書きモード警告 */}
          {step === "overwriteWarn" && (
            <div style={{
              position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)",
              display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100,
            }}>
              <div style={{
                background: C.bg, borderRadius: 12, padding: 24, width: "90%", maxWidth: 340,
              }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: C.danger, marginBottom: 12 }}>
                  注意: 上書きモード
                </div>
                <div style={{ fontSize: 14, color: C.text, marginBottom: 20, lineHeight: 1.6 }}>
                  既存データがすべて削除されます。インポートしたデータのみが残ります。続けますか？
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button
                    onClick={resetState}
                    style={{
                      flex: 1, padding: "12px 0",
                      background: "none", border: `1px solid ${C.border}`, borderRadius: 8,
                      fontSize: 14, color: C.sub, cursor: "pointer",
                    }}
                  >
                    キャンセル
                  </button>
                  <button
                    onClick={handleOverwriteConfirm}
                    style={{
                      flex: 1, padding: "12px 0",
                      background: C.danger, color: "#fff", border: "none", borderRadius: 8,
                      fontSize: 14, fontWeight: 600, cursor: "pointer",
                    }}
                  >
                    続ける
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 確認ダイアログ */}
          {step === "confirm" && summary && (
            <div style={{
              position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)",
              display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100,
            }}>
              <div style={{
                background: C.bg, borderRadius: 12, padding: 24, width: "90%", maxWidth: 340,
              }}>
                <div style={{ fontSize: 15, fontWeight: 700, color: C.text, marginBottom: 12 }}>
                  インポート内容の確認
                </div>
                <div style={{ fontSize: 14, color: C.text, marginBottom: 16, lineHeight: 1.8 }}>
                  {mode === "append" && summary.skipped > 0 ? (
                    <>
                      <div>{summary.days}日分のデータを検出</div>
                      <div style={{ color: C.sub }}>うち{summary.skipped}日分は既存データと重複のためスキップ</div>
                      <div style={{ fontWeight: 600 }}>{summary.importDays}日分のトレーニング、{summary.sets}セットをインポートします</div>
                    </>
                  ) : (

                  )}
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button
                    onClick={resetState}
                    style={{
                      flex: 1, padding: "12px 0",

          {/* 完了ダイアログ */}

          )}

    }

    function TemplateManager({ db }) {
      const [showForm, setShowForm] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [tplName, setTplName] = useState("");
      const [selectedIds, setSelectedIds] = useState([]);
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);

          prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]

          return;
        }
        setEditingId(null);
        setTplName("");
        setSelectedIds([]);
        setShowForm(true);
      };

      const startEdit = (tpl) => {
        setEditingId(tpl.id);
        setTplName(tpl.name);
        setSelectedIds([...tpl.exerciseIds]);
        setShowForm(true);
      };

      const handleSave = () => {
        const trimmed = tplName.trim();
        if (!trimmed || selectedIds.length === 0) return;
        if (editingId) {
          db.updateTemplate(editingId, { name: trimmed, exerciseIds: selectedIds });
        } else {
          db.addTemplate(trimmed, selectedIds);
        }
        setShowForm(false);
        setEditingId(null);
        setTplName("");
        setSelectedIds([]);
      };

      const handleDelete = () => {
        if (confirmDeleteId) {
          db.deleteTemplate(confirmDeleteId);
          setConfirmDeleteId(null);
        }
      };

      const getExerciseNames = (exerciseIds) => {
        return exerciseIds
          .map((id) => {
            const ex = db.exercises.find((e) => e.id === id);

                  <div style={{ fontSize: 12, color: C.sub, marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>

                </div>
                <div style={{ display: "flex", gap: 6, flexShrink: 0, marginLeft: 8 }}>

                    style={{

                      border: `1px solid ${C.border}`, borderRadius: 6,
                      fontSize: 12, color: C.sub, cursor: "pointer",
                    }}
                  >
                    編集
                  </button>
                  <button
                    onClick={() => setConfirmDeleteId(tpl.id)}
                    style={{
                      padding: "4px 10px", background: "none",
                      border: `1px solid ${C.border}`, borderRadius: 6,
                      fontSize: 12, color: C.danger, cursor: "pointer",
                    }}
                  >
                    ×
                  </button>
                </div>
              </div>
            </div>
          ))}

          {/* テンプレート追加ボタン */}
          <button
            onClick={startNew}
            style={{
              width: "100%", padding: "10px 0", marginTop: 8,
              background: "none", border: `1px dashed ${C.border}`, borderRadius: 8,
              color: C.accent, fontSize: 14, fontWeight: 600, cursor: "pointer",

            + テンプレート追加

          {/* テンプレート登録・編集フォーム（モーダル） */}
          {showForm && (
            <div style={{
              position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)",
              display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 100,

            >
              <div style={{

                background: C.bg, borderRadius: "16px 16px 0 0",
                padding: "20px 16px", overflowY: "auto",
              }}>
                <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 16, color: C.text }}>

                </div>

                {/* テンプレート名 */}
                <input
                  type="text"
                  value={tplName}
                  onChange={(e) => setTplName(e.target.value)}

                  autoFocus
                  style={{
                    width: "100%", padding: "10px 12px", marginBottom: 12,
                    border: `1px solid ${C.border}`, borderRadius: 8,
                    fontSize: 14, color: C.text, boxSizing: "border-box",

                />

                {/* 種目選択 */}
                <div style={{ fontSize: 13, color: C.sub, marginBottom: 8 }}>種目を選択（タップで追加/解除）:</div>
                <div style={{ maxHeight: 300, overflowY: "auto", marginBottom: 16 }}>
                  {db.activeExercises.map((ex) => {

                {selectedIds.length > 0 && (
                  <div style={{ fontSize: 12, color: C.sub, marginBottom: 12 }}>
                    選択中: {selectedIds.map((id) => {

                <div style={{ display: "flex", gap: 8 }}>
                  <button
                    onClick={() => setShowForm(false)}
                    style={{

                      fontSize: 14, color: C.sub, cursor: "pointer",

                  </button>
                  <button
                    onClick={handleSave}
                    disabled={!tplName.trim() || selectedIds.length === 0}
                    style={{
                      flex: 1, padding: "12px 0",
                      background: (!tplName.trim() || selectedIds.length === 0) ? "#D1D5DB" : C.accent,
                      color: "#fff", border: "none", borderRadius: 8,
                      fontSize: 14, fontWeight: 600, cursor: "pointer",
                    }}
                  >
                    {editingId ? "更新" : "登録"}
                  </button>

              </div>
            </div>
          )}

          {/* 削除確認ダイアログ */}
          {confirmDeleteId && (
            <div style={{
              position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)",
              display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100,

              <div style={{

                <div style={{ fontSize: 15, fontWeight: 700, color: C.text, marginBottom: 12 }}>

                <div style={{ display: "flex", gap: 8 }}>
