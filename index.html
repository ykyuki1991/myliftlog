    // ============================================================
    // 画面: 食事管理（NutritionScreen）— 新規追加
    // ============================================================
    function NutritionScreen({ db }) {
      const [currentDate, setCurrentDate] = useState(todayStr());
      const [showAddFood, setShowAddFood] = useState(null); // mealType or null
      const [showMealTplPicker, setShowMealTplPicker] = useState(null); // mealType or null

      const workout = db.getWorkoutByDate(currentDate);
      const hasWorkout = !!workout && db.sets.some((s) => s.workoutId === workout?.id);

      // トレーニング日判定: 1) 手動上書き優先 2) workout記録有無 3) デフォルトrest
      const manualOverride = db.trainingDayOverrides[currentDate];
      const isTrainingDay = manualOverride
        ? manualOverride === "training"
        : hasWorkout;

      const goals = isTrainingDay
        ? db.nutritionSettings.goals.trainingDay
        : db.nutritionSettings.goals.restDay;

      const mealsForDate = db.mealEntries.filter((e) => e.date === currentDate);
      const intake = mealsForDate.reduce(
        (acc, e) => ({ kcal: acc.kcal + (e.kcal || 0), protein: acc.protein + (e.protein || 0), fat: acc.fat + (e.fat || 0), carbs: acc.carbs + (e.carbs || 0) }),
        { kcal: 0, protein: 0, fat: 0, carbs: 0 }
      );

      // 警告
      const warnings = [];
      if (intake.fat > goals.fat) warnings.push("脂質が目標を超過しています");
      if (intake.kcal > goals.kcal) warnings.push("総カロリーが目標を超過しています");
      if (intake.protein < goals.protein && mealsForDate.length > 0) warnings.push("たんぱく質が目標に不足しています");

      // 週平均体重補正提案（直近7日 vs 前7日のカレンダー日ベース）
      const getWeightProposal = () => {
        const today = new Date(currentDate + "T00:00:00");
        // 直近7日: currentDate から6日前まで
        const recentStart = new Date(today);
        recentStart.setDate(today.getDate() - 6);
        const recentStartStr = recentStart.toISOString().slice(0, 10);
        // 前7日: 7日前〜13日前
        const prevEnd = new Date(recentStart);
        prevEnd.setDate(recentStart.getDate() - 1);
        const prevStart = new Date(prevEnd);
        prevStart.setDate(prevEnd.getDate() - 6);
        const prevStartStr = prevStart.toISOString().slice(0, 10);
        const prevEndStr = prevEnd.toISOString().slice(0, 10);

        const weightsWithDate = db.workouts.filter((w) => w.bodyWeight !== null);
        const recent = weightsWithDate.filter((w) => w.date >= recentStartStr && w.date <= currentDate);
        const prev = weightsWithDate.filter((w) => w.date >= prevStartStr && w.date <= prevEndStr);

        if (recent.length < 2) return null; // 直近7日に2件未満なら表示しない
        if (prev.length < 2) return null;

        const avg = (arr) => arr.reduce((s, w) => s + w.bodyWeight, 0) / arr.length;
        const recentAvg = avg(recent);
        const prevAvg = avg(prev);
        const diff = recentAvg - prevAvg;
        const recentNote = `直近7日平均 (${recent.length}件)`;
        const prevNote = `前7日平均 (${prev.length}件)`;
        if (Math.abs(diff) < 0.1) return { type: "slow", msg: "体重変化が小さいため、摂取カロリーを少し下げることを検討してください", recentAvg: recentAvg.toFixed(1), prevAvg: prevAvg.toFixed(1), recentNote, prevNote };
        if (diff < -0.5) return { type: "fast", msg: "体重の減少が大きいため、摂取カロリーを少し戻すことを検討してください", recentAvg: recentAvg.toFixed(1), prevAvg: prevAvg.toFixed(1), recentNote, prevNote };
        return { type: "ok", msg: "現在のペースは適切です", recentAvg: recentAvg.toFixed(1), prevAvg: prevAvg.toFixed(1), recentNote, prevNote };
      };
      const proposal = getWeightProposal();

      const toggleDayType = () => {
        db.setTrainingDayOverride(currentDate, isTrainingDay ? "rest" : "training");
      };

      // PFCバー
      const PFCBar = ({ label, current, goal, color }) => {
        const pct = goal > 0 ? Math.min((current / goal) * 100, 100) : 0;
        const over = current > goal;
        return (
          <div style={{ marginBottom: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: C.text, marginBottom: 2 }}>
              <span style={{ fontWeight: 600 }}>{label}</span>
              <span style={{ color: over ? C.danger : C.sub }}>{Math.round(current)} / {goal}{label === "カロリー" ? " kcal" : " g"}</span>
            </div>
            <div style={{ height: 8, background: "#F3F4F6", borderRadius: 4, overflow: "hidden" }}>
              <div style={{ width: `${pct}%`, height: "100%", background: over ? C.danger : color, borderRadius: 4, transition: "width 0.3s" }} />
            </div>
          </div>
        );
      };

      return (
        <div style={{ paddingBottom: 80 }}>
          {/* 日付セレクター */}
          <DateSelector date={currentDate} onChange={setCurrentDate} />

          {/* 体重 & トレ日トグル */}
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
            <div style={{
              flex: 1, padding: "8px 12px",
              background: isTrainingDay ? "#DBEAFE" : C.cardBg,
              border: `1px solid ${isTrainingDay ? "#93C5FD" : C.border}`,
              borderRadius: 8, fontSize: 13,
            }}>
              <span style={{ fontWeight: 600 }}>{isTrainingDay ? "トレーニング日" : "休養日"}</span>
              {workout && workout.bodyWeight && (
                <span style={{ color: C.sub, marginLeft: 8 }}>体重: {workout.bodyWeight}kg</span>
              )}
            </div>
            <button
              onClick={toggleDayType}
              style={{
                padding: "8px 12px", background: "none",
                border: `1px solid ${C.border}`, borderRadius: 8,
                fontSize: 11, color: C.accent, cursor: "pointer", fontWeight: 600, whiteSpace: "nowrap",
              }}
            >切替</button>
          </div>

          {/* 日次サマリー */}
          <div style={{
            padding: "14px", marginBottom: 12,
            background: C.cardBg, borderRadius: 10, border: `1px solid ${C.border}`,
          }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: C.text, marginBottom: 10 }}>今日のサマリー</div>
            <PFCBar label="カロリー" current={intake.kcal} goal={goals.kcal} color={C.accent} />
            <PFCBar label="たんぱく質(P)" current={intake.protein} goal={goals.protein} color="#059669" />
            <PFCBar label="脂質(F)" current={intake.fat} goal={goals.fat} color="#F59E0B" />
            <PFCBar label="炭水化物(C)" current={intake.carbs} goal={goals.carbs} color="#8B5CF6" />
          </div>

          {/* 警告エリア */}
          {warnings.length > 0 && (
            <div style={{
              padding: "10px 14px", marginBottom: 12,
              background: C.warningBg, border: `1px solid ${C.warning}`,
              borderRadius: 8, fontSize: 13, color: "#92400E", lineHeight: 1.6,
            }}>
              {warnings.map((w, i) => <div key={i}>{w}</div>)}
            </div>
          )}

          {/* 週平均体重補正提案 */}
          {proposal && (
            <div style={{
              padding: "10px 14px", marginBottom: 12,
              background: proposal.type === "ok" ? "#ECFDF5" : "#FEF3C7",
              border: `1px solid ${proposal.type === "ok" ? "#6EE7B7" : "#F59E0B"}`,
              borderRadius: 8, fontSize: 12, color: C.text, lineHeight: 1.6,
            }}>
              <div style={{ fontWeight: 600, marginBottom: 4 }}>{proposal.recentNote}: {proposal.recentAvg}kg（{proposal.prevNote}: {proposal.prevAvg}kg）</div>
              <div style={{ color: C.sub }}>{proposal.msg}</div>
            </div>
          )}

          {/* 食事区分ブロック */}
          {MEAL_TYPES.map(({ key, label }) => {
            const entries = mealsForDate.filter((e) => e.mealType === key);
            const blockTotal = entries.reduce(
              (acc, e) => ({ kcal: acc.kcal + (e.kcal || 0), protein: acc.protein + (e.protein || 0), fat: acc.fat + (e.fat || 0), carbs: acc.carbs + (e.carbs || 0) }),
              { kcal: 0, protein: 0, fat: 0, carbs: 0 }
            );
            return (
              <div key={key} style={{
                padding: "12px 14px", marginBottom: 10,
                background: C.cardBg, borderRadius: 10, border: `1px solid ${C.border}`,
              }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                  <span style={{ fontSize: 14, fontWeight: 700, color: C.text }}>{label}</span>
                  {entries.length > 0 && (
                    <span style={{ fontSize: 11, color: C.sub }}>
                      {Math.round(blockTotal.kcal)}kcal P{Math.round(blockTotal.protein)} F{Math.round(blockTotal.fat)} C{Math.round(blockTotal.carbs)}
                    </span>
                  )}
                </div>

                {entries.map((entry) => (
                  <div key={entry.id} style={{
                    display: "flex", alignItems: "center", justifyContent: "space-between",
                    padding: "6px 0", borderBottom: `1px solid ${C.border}`,
                    fontSize: 13,
                  }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ color: C.text, fontWeight: 500 }}>{entry.nameSnapshot}</div>
                      <div style={{ fontSize: 11, color: C.sub }}>
                        {entry.amount}{entry.unit} / {entry.kcal}kcal P{entry.protein} F{entry.fat} C{entry.carbs}
                      </div>
                    </div>
                    <button
                      onClick={() => db.deleteMealEntry(entry.id)}
                      style={{
                        background: "none", border: "none", color: C.danger,
                        fontSize: 16, cursor: "pointer", padding: "4px 8px", flexShrink: 0,
                      }}
                    >×</button>
                  </div>
                ))}

                <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                  <button
                    onClick={() => setShowAddFood(key)}
                    style={{
                      flex: 1, padding: "8px 0",
                      background: "none", border: `1px dashed ${C.border}`, borderRadius: 6,
                      color: C.accent, fontSize: 12, fontWeight: 600, cursor: "pointer",
                    }}
                  >+ 食材追加</button>
                  {db.mealTemplates.length > 0 && (
                    <button
                      onClick={() => setShowMealTplPicker(key)}
                      style={{
                        padding: "8px 10px",
                        background: "none", border: `1px dashed ${C.border}`, borderRadius: 6,
                        color: C.accent, fontSize: 11, cursor: "pointer", whiteSpace: "nowrap",
                      }}
                    >テンプレ</button>
                  )}
                </div>
              </div>
            );
          })}

          {/* 食材追加モーダル */}
          {showAddFood && (
            <AddFoodModal
              db={db}
              date={currentDate}
              mealType={showAddFood}
              onClose={() => setShowAddFood(null)}
            />
          )}

          {/* 食事テンプレ選択モーダル */}
          {showMealTplPicker && (
            <MealTplPickerModal
              db={db}
              date={currentDate}
              mealType={showMealTplPicker}
              onClose={() => setShowMealTplPicker(null)}
            />
          )}

          {/* 食事履歴（直近の日別サマリー） */}
          <NutritionHistory db={db} currentDate={currentDate} onDateSelect={setCurrentDate} />
        </div>
      );
    }

    // ============================================================
    // 食事履歴コンポーネント（NutritionHistory）
    // ============================================================
    function NutritionHistory({ db, currentDate, onDateSelect }) {
      const [expanded, setExpanded] = useState(false);

      // 食事記録がある日付を集計（新しい順）
      const dailySummaries = useMemo(() => {
        const dateMap = {};
        db.mealEntries.forEach((e) => {
          if (!dateMap[e.date]) dateMap[e.date] = { kcal: 0, protein: 0, fat: 0, carbs: 0, count: 0 };
          dateMap[e.date].kcal += e.kcal || 0;
          dateMap[e.date].protein += e.protein || 0;
          dateMap[e.date].fat += e.fat || 0;
          dateMap[e.date].carbs += e.carbs || 0;
          dateMap[e.date].count += 1;
        });
        return Object.entries(dateMap)
          .map(([date, totals]) => ({ date, ...totals }))
          .sort((a, b) => (a.date > b.date ? -1 : 1))
          .slice(0, 30); // 最大30日分
      }, [db.mealEntries]);

      if (dailySummaries.length === 0) return null;

      return (
        <div style={{ marginTop: 16 }}>
          <button onClick={() => setExpanded(!expanded)}
            style={{ display: "flex", width: "100%", alignItems: "center", justifyContent: "space-between", padding: "10px 0", background: "none", border: "none", cursor: "pointer" }}
          >
            <span style={{ fontSize: 15, fontWeight: 700, color: C.text }}>食事履歴</span>
            <span style={{ fontSize: 13, color: C.sub }}>{expanded ? "▼" : "▶"}</span>
          </button>

          {expanded && (
            <div>
              {dailySummaries.map((day) => (
                <button key={day.date} onClick={() => onDateSelect(day.date)}
                  style={{
                    display: "block", width: "100%", textAlign: "left",
                    padding: "10px 12px", marginBottom: 4,
                    background: day.date === currentDate ? "#DBEAFE" : C.cardBg,
                    border: `1px solid ${day.date === currentDate ? "#93C5FD" : C.border}`,
                    borderRadius: 8, cursor: "pointer",
                  }}
                >
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span style={{ fontSize: 13, fontWeight: 600, color: C.text }}>{formatDateJP(day.date)}</span>
                    <span style={{ fontSize: 13, fontWeight: 700, color: C.accent }}>{Math.round(day.kcal)} kcal</span>
                  </div>
                  <div style={{ fontSize: 11, color: C.sub, marginTop: 2 }}>
                    P {Math.round(day.protein)}g / F {Math.round(day.fat)}g / C {Math.round(day.carbs)}g（{day.count}品）
                  </div>
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // 食材追加モーダル（AddFoodModal）
    // ============================================================
    function AddFoodModal({ db, date, mealType, onClose }) {
      const [mode, setMode] = useState(db.foods.length > 0 ? "quick" : "manual");
      const [selectedFood, setSelectedFood] = useState(null);
      const [amount, setAmount] = useState("");
      const [name, setName] = useState("");
      const [unit, setUnit] = useState("g");
      const [kcal, setKcal] = useState("");
      const [protein, setProtein] = useState("");
      const [fat, setFat] = useState("");
      const [carbs, setCarbs] = useState("");
      const [saveToMaster, setSaveToMaster] = useState(false);

      const handleSelectFood = (food) => {
        setSelectedFood(food);
        setAmount(String(food.baseAmount));
      };

      const handleAddFromMaster = () => {
        if (!selectedFood || !amount) return;
        const ratio = parseFloat(amount) / selectedFood.baseAmount;
        db.addMealEntry(date, mealType, selectedFood.id, null, selectedFood.name,
          parseFloat(amount), selectedFood.baseUnit,
          selectedFood.kcal * ratio, selectedFood.protein * ratio,
          selectedFood.fat * ratio, selectedFood.carbs * ratio);
        onClose();
      };

      const handleAddManual = () => {
        if (!name.trim() || !kcal) return;
        const amt = parseFloat(amount) || 100;
        const k = parseFloat(kcal) || 0;
        const p = parseFloat(protein) || 0;
        const f = parseFloat(fat) || 0;
        const c = parseFloat(carbs) || 0;
        db.addMealEntry(date, mealType, null, null, name.trim(), amt, unit, k, p, f, c);
        if (saveToMaster) {
          db.addFood(name.trim(), amt, unit, k, p, f, c, true);
        }
        onClose();
      };

      const mealLabel = MEAL_TYPES.find((m) => m.key === mealType)?.label || mealType;

      return (
        <div style={{
          position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)",
          display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 100,
        }}
          onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
        >
          <div style={{
            width: "100%", maxWidth: 480, maxHeight: "85vh",
            background: C.bg, borderRadius: "16px 16px 0 0",
            padding: "20px 16px", overflowY: "auto",
          }}>
            <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 4, color: C.text }}>食材を追加</div>
            <div style={{ fontSize: 12, color: C.sub, marginBottom: 16 }}>{mealLabel}に追加</div>

            {/* モード切替 */}
            <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
              <button onClick={() => setMode("quick")}
                style={{
                  flex: 1, padding: "10px 0",
                  background: mode === "quick" ? C.accent : C.cardBg,
                  color: mode === "quick" ? "#fff" : C.text,
                  border: `1px solid ${mode === "quick" ? C.accent : C.border}`,
                  borderRadius: 6, fontSize: 13, fontWeight: 600, cursor: "pointer",
                }}>よく使う食材</button>
              <button onClick={() => setMode("manual")}
                style={{
                  flex: 1, padding: "10px 0",
                  background: mode === "manual" ? C.accent : C.cardBg,
                  color: mode === "manual" ? "#fff" : C.text,
                  border: `1px solid ${mode === "manual" ? C.accent : C.border}`,
                  borderRadius: 6, fontSize: 13, fontWeight: 600, cursor: "pointer",
                }}>手入力</button>
            </div>

            {mode === "quick" && (
              <>
                {db.foods.length === 0 ? (
                  <div style={{ fontSize: 13, color: C.sub, textAlign: "center", padding: "20px 0" }}>
                    食材マスタが空です。設定画面で登録するか、手入力をご利用ください。
                  </div>
                ) : (
                  <>
                    <div style={{ maxHeight: 200, overflowY: "auto", marginBottom: 12 }}>
                      {db.foods.filter((f) => f.isFavorite).map((food) => (
                        <button key={food.id} onClick={() => handleSelectFood(food)}
                          style={{
                            display: "block", width: "100%", textAlign: "left",
                            padding: "10px 12px", marginBottom: 4,
                            background: selectedFood?.id === food.id ? "#DBEAFE" : C.cardBg,
                            border: `1px solid ${selectedFood?.id === food.id ? "#93C5FD" : C.border}`,
                            borderRadius: 8, fontSize: 13, color: C.text, cursor: "pointer",
                          }}
                        >
                          <div style={{ fontWeight: 600 }}>{food.name}</div>
                          <div style={{ fontSize: 11, color: C.sub }}>
                            {food.baseAmount}{food.baseUnit}あたり: {food.kcal}kcal P{food.protein} F{food.fat} C{food.carbs}
                          </div>
                        </button>
                      ))}
                    </div>
                    {selectedFood && (
                      <div style={{ marginBottom: 12 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                          <span style={{ fontSize: 13, color: C.sub }}>量:</span>
                          <input type="number" inputMode="decimal" value={amount} onChange={(e) => setAmount(e.target.value)}
                            style={{ flex: 1, padding: "10px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 14, textAlign: "center" }}
                          />
                          <span style={{ fontSize: 13, color: C.sub }}>{selectedFood.baseUnit}</span>
                        </div>
                        {amount && (
                          <div style={{ fontSize: 12, color: C.sub, marginBottom: 8 }}>
                            {(() => {
                              const r = parseFloat(amount) / selectedFood.baseAmount;
                              return `${Math.round(selectedFood.kcal * r)}kcal P${Math.round(selectedFood.protein * r * 10) / 10} F${Math.round(selectedFood.fat * r * 10) / 10} C${Math.round(selectedFood.carbs * r * 10) / 10}`;
                            })()}
                          </div>
                        )}
                        <button onClick={handleAddFromMaster}
                          style={{ width: "100%", padding: "12px 0", background: C.accent, color: "#fff", border: "none", borderRadius: 8, fontSize: 14, fontWeight: 600, cursor: "pointer" }}
                        >追加</button>
                      </div>
                    )}
                  </>
                )}
              </>
            )}

            {mode === "manual" && (
              <div>
                <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="食材名（例: プロテイン）"
                  style={{ width: "100%", padding: "10px 12px", marginBottom: 8, border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 14, color: C.text, boxSizing: "border-box" }}
                />
                <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                  <input type="number" inputMode="decimal" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="量"
                    style={{ flex: 1, padding: "10px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 14, textAlign: "center" }}
                  />
                  <select value={unit} onChange={(e) => setUnit(e.target.value)}
                    style={{ padding: "10px 8px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 14, background: C.bg }}
                  >
                    <option value="g">g</option>
                    <option value="ml">ml</option>
                    <option value="個">個</option>
                    <option value="食分">食分</option>
                  </select>
                </div>
                <input type="number" inputMode="decimal" value={kcal} onChange={(e) => setKcal(e.target.value)} placeholder="カロリー (kcal)"
                  style={{ width: "100%", padding: "10px 12px", marginBottom: 8, border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 14, color: C.text, boxSizing: "border-box" }}
                />
                <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                  <input type="number" inputMode="decimal" value={protein} onChange={(e) => setProtein(e.target.value)} placeholder="P (g)"
                    style={{ flex: 1, padding: "10px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 14, textAlign: "center" }}
                  />
                  <input type="number" inputMode="decimal" value={fat} onChange={(e) => setFat(e.target.value)} placeholder="F (g)"
                    style={{ flex: 1, padding: "10px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 14, textAlign: "center" }}
                  />
                  <input type="number" inputMode="decimal" value={carbs} onChange={(e) => setCarbs(e.target.value)} placeholder="C (g)"
                    style={{ flex: 1, padding: "10px 12px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 14, textAlign: "center" }}
                  />
                </div>
                <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: C.sub, marginBottom: 12, cursor: "pointer" }}>
                  <input type="checkbox" checked={saveToMaster} onChange={(e) => setSaveToMaster(e.target.checked)} />
                  よく使う食材に保存
                </label>
                <button onClick={handleAddManual}
                  disabled={!name.trim() || !kcal}
                  style={{
                    width: "100%", padding: "12px 0",
                    background: (name.trim() && kcal) ? C.accent : "#D1D5DB",
                    color: "#fff", border: "none", borderRadius: 8,
                    fontSize: 14, fontWeight: 600, cursor: "pointer",
                  }}
                >追加</button>
              </div>
            )}

            <button onClick={onClose}
              style={{ width: "100%", padding: "12px 0", marginTop: 12, background: "none", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 14, color: C.sub, cursor: "pointer", fontWeight: 600 }}
            >キャンセル</button>
          </div>
        </div>
      );
    }

    // ============================================================
    // 食事テンプレ選択モーダル（MealTplPickerModal）
    // ============================================================
    function MealTplPickerModal({ db, date, mealType, onClose }) {
      const handleApply = (tpl) => {
        tpl.items.forEach((item) => {
          const food = db.foods.find((f) => f.id === item.foodId);
          if (!food) return;
          const ratio = (item.amount || food.baseAmount) / food.baseAmount;
          db.addMealEntry(date, mealType, food.id, tpl.id, food.name,
            item.amount || food.baseAmount, item.unit || food.baseUnit,
            food.kcal * ratio, food.protein * ratio, food.fat * ratio, food.carbs * ratio);
        });
        onClose();
      };

      return (
        <div style={{
          position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)",
          display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 100,
        }}
          onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
        >
          <div style={{
            width: "100%", maxWidth: 480, maxHeight: "70vh",
            background: C.bg, borderRadius: "16px 16px 0 0",
            padding: "20px 16px", overflowY: "auto",
          }}>
            <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 16, color: C.text }}>食事テンプレートから追加</div>

            {db.mealTemplates.map((tpl) => {
              const totalKcal = tpl.items.reduce((sum, item) => {
                const food = db.foods.find((f) => f.id === item.foodId);
                if (!food) return sum;
                const ratio = (item.amount || food.baseAmount) / food.baseAmount;
                return sum + food.kcal * ratio;
              }, 0);
              return (
                <button key={tpl.id} onClick={() => handleApply(tpl)}
                  style={{
                    display: "block", width: "100%", textAlign: "left",
                    padding: "12px", marginBottom: 6,
                    background: C.cardBg, border: `1px solid ${C.border}`, borderRadius: 8, cursor: "pointer",
                  }}
                >
                  <div style={{ fontSize: 15, fontWeight: 600, color: C.text }}>{tpl.name}</div>
                  <div style={{ fontSize: 12, color: C.sub, marginTop: 4 }}>
                    {tpl.items.length}品 / 約{Math.round(totalKcal)}kcal
                  </div>
                </button>
              );
            })}

            <button onClick={onClose}
              style={{ width: "100%", padding: "14px 0", marginTop: 12, background: "none", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 15, color: C.sub, cursor: "pointer", fontWeight: 600 }}
            >キャンセル</button>
          </div>
        </div>
      );
    }

    // ============================================================
    // 設定: 栄養目標設定セクション
    // ============================================================
    function NutritionGoalSettingsSection({ db }) {
      const [expanded, setExpanded] = useState(false);
      const profile = db.nutritionSettings.profile;
      const goals = db.nutritionSettings.goals;

      const handleProfileChange = (key, value) => {
        const newProfile = { ...profile, [key]: value };
        db.updateNutritionSettings({ profile: newProfile });
      };

      const handleAutoCalc = () => {
        const latestW = db.workouts
          .filter((w) => w.bodyWeight !== null)
          .sort((a, b) => (a.date > b.date ? -1 : 1))[0];
        const bodyWeight = latestW ? latestW.bodyWeight : 70;
        const newGoals = calcNutritionGoals(profile, bodyWeight);
        db.updateNutritionGoals(newGoals);
      };

      const handleGoalChange = (dayType, key, value) => {
        const v = parseInt(value, 10);
        if (isNaN(v) || v < 0) return;
        const newGoals = {
          ...goals,
          [dayType]: { ...goals[dayType], [key]: v },
          isManualOverride: true,
        };
        db.updateNutritionGoals(newGoals);
      };

      const GoalRow = ({ dayLabel, dayKey }) => (
        <div style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: C.text, marginBottom: 6 }}>{dayLabel}</div>
          <div style={{ display: "flex", gap: 6 }}>
            {[{ k: "kcal", l: "kcal" }, { k: "protein", l: "P(g)" }, { k: "fat", l: "F(g)" }, { k: "carbs", l: "C(g)" }].map(({ k, l }) => (
              <div key={k} style={{ flex: 1 }}>
                <div style={{ fontSize: 10, color: C.sub, marginBottom: 2 }}>{l}</div>
                <input type="number" inputMode="numeric" value={goals[dayKey][k]}
                  onChange={(e) => handleGoalChange(dayKey, k, e.target.value)}
                  style={{ width: "100%", padding: "8px 4px", border: `1px solid ${C.border}`, borderRadius: 4, fontSize: 13, textAlign: "center", boxSizing: "border-box" }}
                />
              </div>
            ))}
          </div>
        </div>
      );

      return (
        <div style={{ marginBottom: 24 }}>
          <button onClick={() => setExpanded(!expanded)}
            style={{ display: "flex", width: "100%", alignItems: "center", justifyContent: "space-between", padding: 0, background: "none", border: "none", cursor: "pointer" }}
          >
            <span style={{ fontSize: 16, fontWeight: 700, color: C.text }}>食事目標設定</span>
            <span style={{ fontSize: 13, color: C.sub }}>{expanded ? "▼" : "▶"}</span>
          </button>

          {expanded && (
            <div style={{ marginTop: 12 }}>
              {/* プロフィール */}
              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 11, color: C.sub, marginBottom: 2 }}>性別</div>
                  <select value={profile.sex} onChange={(e) => handleProfileChange("sex", e.target.value)}
                    style={{ width: "100%", padding: "8px", border: `1px solid ${C.border}`, borderRadius: 4, fontSize: 13, background: C.bg }}
                  ><option value="male">男性</option><option value="female">女性</option></select>
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 11, color: C.sub, marginBottom: 2 }}>年齢</div>
                  <input type="number" value={profile.age} onChange={(e) => handleProfileChange("age", parseInt(e.target.value) || 0)}
                    style={{ width: "100%", padding: "8px", border: `1px solid ${C.border}`, borderRadius: 4, fontSize: 13, textAlign: "center", boxSizing: "border-box" }}
                  />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 11, color: C.sub, marginBottom: 2 }}>身長cm</div>
                  <input type="number" value={profile.heightCm} onChange={(e) => handleProfileChange("heightCm", parseInt(e.target.value) || 0)}
                    style={{ width: "100%", padding: "8px", border: `1px solid ${C.border}`, borderRadius: 4, fontSize: 13, textAlign: "center", boxSizing: "border-box" }}
                  />
                </div>
              </div>
              <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 11, color: C.sub, marginBottom: 2 }}>活動量</div>
                  <select value={profile.activityLevel} onChange={(e) => handleProfileChange("activityLevel", e.target.value)}
                    style={{ width: "100%", padding: "8px", border: `1px solid ${C.border}`, borderRadius: 4, fontSize: 13, background: C.bg }}
                  >{Object.entries(ACTIVITY_LABELS).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select>
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 11, color: C.sub, marginBottom: 2 }}>目標</div>
                  <select value={profile.goalType} onChange={(e) => handleProfileChange("goalType", e.target.value)}
                    style={{ width: "100%", padding: "8px", border: `1px solid ${C.border}`, borderRadius: 4, fontSize: 13, background: C.bg }}
                  ><option value="cut">減量</option><option value="maintain">維持</option><option value="bulk">増量</option></select>
                </div>
              </div>

              <button onClick={handleAutoCalc}
                style={{ width: "100%", padding: "10px 0", marginBottom: 16, background: C.accent, color: "#fff", border: "none", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer" }}
              >自動計算する</button>

              {/* 目標値（手動編集可能） */}
              <GoalRow dayLabel="トレーニング日" dayKey="trainingDay" />
              <GoalRow dayLabel="休養日" dayKey="restDay" />

              {goals.isManualOverride && (
                <div style={{ fontSize: 11, color: C.sub, marginTop: 4 }}>※手動で変更済み（自動計算で上書きできます）</div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // 設定: 食材マスタ管理セクション
    // ============================================================
    function FoodMasterSection({ db }) {
      const [expanded, setExpanded] = useState(false);
      const [showForm, setShowForm] = useState(false);
      const [editId, setEditId] = useState(null);
      const [name, setName] = useState("");
      const [baseAmount, setBaseAmount] = useState("100");
      const [baseUnit, setBaseUnit] = useState("g");
      const [kcal, setKcal] = useState("");
      const [protein, setProtein] = useState("");
      const [fat, setFat] = useState("");
      const [carbs, setCarbs] = useState("");

      const resetForm = () => {
        setEditId(null); setName(""); setBaseAmount("100"); setBaseUnit("g");
        setKcal(""); setProtein(""); setFat(""); setCarbs("");
        setShowForm(false);
      };

      const startEdit = (food) => {
        setEditId(food.id); setName(food.name);
        setBaseAmount(String(food.baseAmount)); setBaseUnit(food.baseUnit);
        setKcal(String(food.kcal)); setProtein(String(food.protein));
        setFat(String(food.fat)); setCarbs(String(food.carbs));
        setShowForm(true);
      };

      const handleSave = () => {
        if (!name.trim() || !kcal) return;
        const data = {
          name: name.trim(), baseAmount: parseFloat(baseAmount) || 100, baseUnit,
          kcal: parseFloat(kcal) || 0, protein: parseFloat(protein) || 0,
          fat: parseFloat(fat) || 0, carbs: parseFloat(carbs) || 0,
        };
        if (editId) {
          db.updateFood(editId, data);
        } else {
          db.addFood(data.name, data.baseAmount, data.baseUnit, data.kcal, data.protein, data.fat, data.carbs, true);
        }
        resetForm();
      };

      return (
        <div style={{ marginBottom: 24 }}>
          <button onClick={() => setExpanded(!expanded)}
            style={{ display: "flex", width: "100%", alignItems: "center", justifyContent: "space-between", padding: 0, background: "none", border: "none", cursor: "pointer" }}
          >
            <span style={{ fontSize: 16, fontWeight: 700, color: C.text }}>食材マスタ管理</span>
            <span style={{ fontSize: 13, color: C.sub }}>{expanded ? "▼" : "▶"}</span>
          </button>

          {expanded && (
            <div style={{ marginTop: 12 }}>
              {db.foods.length === 0 && (
                <div style={{ fontSize: 13, color: C.sub, marginBottom: 12 }}>食材が登録されていません。</div>
              )}

              {db.foods.map((food) => (
                <div key={food.id} style={{
                  padding: "10px 12px", marginBottom: 4,
                  background: C.cardBg, borderRadius: 8, border: `1px solid ${C.border}`,
                  display: "flex", justifyContent: "space-between", alignItems: "center",
                }}>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 600, color: C.text }}>{food.name}</div>
                    <div style={{ fontSize: 11, color: C.sub }}>
                      {food.baseAmount}{food.baseUnit}あたり: {food.kcal}kcal P{food.protein} F{food.fat} C{food.carbs}
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                    <button onClick={() => startEdit(food)}
                      style={{ padding: "4px 10px", background: "none", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 12, color: C.sub, cursor: "pointer" }}
                    >編集</button>
                    <button onClick={() => db.deleteFood(food.id)}
                      style={{ padding: "4px 10px", background: "none", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 12, color: C.danger, cursor: "pointer" }}
                    >×</button>
                  </div>
                </div>
              ))}

              {!showForm ? (
                <button onClick={() => { resetForm(); setShowForm(true); }}
                  style={{ width: "100%", padding: "10px 0", marginTop: 8, background: "none", border: `1px dashed ${C.border}`, borderRadius: 8, color: C.accent, fontSize: 14, fontWeight: 600, cursor: "pointer" }}
                >+ 食材追加</button>
              ) : (
                <div style={{ marginTop: 8, padding: 12, background: C.cardBg, borderRadius: 8, border: `1px solid ${C.border}` }}>
                  <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="食材名"
                    style={{ width: "100%", padding: "8px 10px", marginBottom: 8, border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, boxSizing: "border-box" }}
                  />
                  <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
                    <input type="number" value={baseAmount} onChange={(e) => setBaseAmount(e.target.value)} placeholder="量"
                      style={{ flex: 1, padding: "8px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, textAlign: "center" }}
                    />
                    <select value={baseUnit} onChange={(e) => setBaseUnit(e.target.value)}
                      style={{ padding: "8px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, background: C.bg }}
                    ><option value="g">g</option><option value="ml">ml</option><option value="個">個</option><option value="食分">食分</option></select>
                  </div>
                  <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
                    <input type="number" value={kcal} onChange={(e) => setKcal(e.target.value)} placeholder="kcal"
                      style={{ flex: 1, padding: "8px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, textAlign: "center" }} />
                    <input type="number" value={protein} onChange={(e) => setProtein(e.target.value)} placeholder="P(g)"
                      style={{ flex: 1, padding: "8px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, textAlign: "center" }} />
                    <input type="number" value={fat} onChange={(e) => setFat(e.target.value)} placeholder="F(g)"
                      style={{ flex: 1, padding: "8px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, textAlign: "center" }} />
                    <input type="number" value={carbs} onChange={(e) => setCarbs(e.target.value)} placeholder="C(g)"
                      style={{ flex: 1, padding: "8px", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, textAlign: "center" }} />
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={resetForm}
                      style={{ flex: 1, padding: "10px 0", background: "none", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, color: C.sub, cursor: "pointer" }}
                    >取消</button>
                    <button onClick={handleSave}
                      disabled={!name.trim() || !kcal}
                      style={{ flex: 1, padding: "10px 0", background: (name.trim() && kcal) ? C.accent : "#D1D5DB", color: "#fff", border: "none", borderRadius: 6, fontSize: 13, fontWeight: 600, cursor: "pointer" }}
                    >{editId ? "更新" : "登録"}</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // 設定: 食事テンプレ管理セクション
    // ============================================================
    function MealTemplateMasterSection({ db }) {
      const [expanded, setExpanded] = useState(false);
      const [showForm, setShowForm] = useState(false);
      const [tplName, setTplName] = useState("");
      const [selectedFoodIds, setSelectedFoodIds] = useState([]);

      const toggleFood = (id) => {
        setSelectedFoodIds((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);
      };

      const handleSave = () => {
        if (!tplName.trim() || selectedFoodIds.length === 0) return;
        const items = selectedFoodIds.map((fid) => {
          const food = db.foods.find((f) => f.id === fid);
          return { foodId: fid, amount: food ? food.baseAmount : 100, unit: food ? food.baseUnit : "g" };
        });
        db.addMealTemplate(tplName.trim(), items);
        setTplName(""); setSelectedFoodIds([]); setShowForm(false);
      };

      return (
        <div style={{ marginBottom: 24 }}>
          <button onClick={() => setExpanded(!expanded)}
            style={{ display: "flex", width: "100%", alignItems: "center", justifyContent: "space-between", padding: 0, background: "none", border: "none", cursor: "pointer" }}
          >
            <span style={{ fontSize: 16, fontWeight: 700, color: C.text }}>食事テンプレ管理</span>
            <span style={{ fontSize: 13, color: C.sub }}>{expanded ? "▼" : "▶"}</span>
          </button>

          {expanded && (
            <div style={{ marginTop: 12 }}>
              {db.mealTemplates.length === 0 && !showForm && (
                <div style={{ fontSize: 13, color: C.sub, marginBottom: 12 }}>
                  食事テンプレを登録すると、よく食べる組み合わせをワンタップで追加できます。
                </div>
              )}

              {db.mealTemplates.map((tpl) => (
                <div key={tpl.id} style={{
                  padding: "10px 12px", marginBottom: 4,
                  background: C.cardBg, borderRadius: 8, border: `1px solid ${C.border}`,
                  display: "flex", justifyContent: "space-between", alignItems: "center",
                }}>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 600, color: C.text }}>{tpl.name}</div>
                    <div style={{ fontSize: 11, color: C.sub }}>
                      {tpl.items.map((item) => {
                        const food = db.foods.find((f) => f.id === item.foodId);
                        return food ? food.name : "(削除済み)";
                      }).join("、")}
                    </div>
                  </div>
                  <button onClick={() => db.deleteMealTemplate(tpl.id)}
                    style={{ padding: "4px 10px", background: "none", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 12, color: C.danger, cursor: "pointer", flexShrink: 0 }}
                  >×</button>
                </div>
              ))}

              {!showForm ? (
                <button onClick={() => setShowForm(true)}
                  disabled={db.foods.length === 0}
                  style={{
                    width: "100%", padding: "10px 0", marginTop: 8,
                    background: "none", border: `1px dashed ${C.border}`, borderRadius: 8,
                    color: db.foods.length > 0 ? C.accent : C.sub,
                    fontSize: 14, fontWeight: 600, cursor: "pointer",
                  }}
                >{db.foods.length > 0 ? "+ テンプレ追加" : "食材を先に登録してください"}</button>
              ) : (
                <div style={{ marginTop: 8, padding: 12, background: C.cardBg, borderRadius: 8, border: `1px solid ${C.border}` }}>
                  <input type="text" value={tplName} onChange={(e) => setTplName(e.target.value)} placeholder="テンプレ名（例: いつもの朝食）"
                    style={{ width: "100%", padding: "8px 10px", marginBottom: 8, border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, boxSizing: "border-box" }}
                  />
                  <div style={{ fontSize: 12, color: C.sub, marginBottom: 6 }}>食材を選択:</div>
                  <div style={{ maxHeight: 200, overflowY: "auto", marginBottom: 12 }}>
                    {db.foods.map((food) => (
                      <button key={food.id} onClick={() => toggleFood(food.id)}
                        style={{
                          display: "block", width: "100%", textAlign: "left",
                          padding: "8px 10px", marginBottom: 3,
                          background: selectedFoodIds.includes(food.id) ? "#EFF6FF" : C.bg,
                          border: `1px solid ${selectedFoodIds.includes(food.id) ? C.accent : C.border}`,
                          borderRadius: 6, fontSize: 13, color: C.text, cursor: "pointer",
                        }}
                      >{selectedFoodIds.includes(food.id) ? "✓ " : ""}{food.name}</button>
                    ))}
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => { setShowForm(false); setTplName(""); setSelectedFoodIds([]); }}
                      style={{ flex: 1, padding: "10px 0", background: "none", border: `1px solid ${C.border}`, borderRadius: 6, fontSize: 13, color: C.sub, cursor: "pointer" }}
                    >取消</button>
                    <button onClick={handleSave}
                      disabled={!tplName.trim() || selectedFoodIds.length === 0}
                      style={{ flex: 1, padding: "10px 0", background: (tplName.trim() && selectedFoodIds.length > 0) ? C.accent : "#D1D5DB", color: "#fff", border: "none", borderRadius: 6, fontSize: 13, fontWeight: 600, cursor: "pointer" }}
                    >登録</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // 画面: 設定（SettingsScreen）— 設計書 2-4
    // ============================================================
    function SettingsScreen({ db }) {
      return (
        <div style={{ paddingBottom: 80 }}>
          <div style={{ fontSize: 18, fontWeight: 700, color: C.text, marginBottom: 16 }}>設定</div>

          {/* 種目管理 */}
          <ExerciseManager db={db} />

          {/* テンプレート管理 */}
          <TemplateManager db={db} />

          {/* --- 食事目標設定 --- */}
          <NutritionGoalSettingsSection db={db} />

          {/* --- 食材マスタ管理 --- */}
          <FoodMasterSection db={db} />

          {/* --- 食事テンプレ管理 --- */}
          <MealTemplateMasterSection db={db} />

          {/* データ管理 */}
          <div style={{ fontSize: 16, fontWeight: 700, color: C.text, marginBottom: 12 }}>データ管理</div>

          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <JsonBackupButton db={db} />
            <JsonRestoreButton db={db} />
            <CsvExportButton db={db} />
            <CsvImportButton db={db} />
            <DataResetButton db={db} />
          </div>

          {/* データ件数サマリー */}
          <div style={{
            marginTop: 20, padding: "12px 14px",
            background: C.cardBg, borderRadius: 8, border: `1px solid ${C.border}`,
            fontSize: 13, color: C.sub, lineHeight: 1.8,
          }}>
            <div>トレーニング日数: {db.workouts.length}日</div>
            <div>登録種目数: {db.activeExercises.length}種目</div>
            <div>総セット数: {db.sets.filter((s) => s.weight > 0 || s.reps > 0).length}セット</div>
            <div>食材マスタ: {db.foods.length}件</div>
            <div>食事記録: {db.mealEntries.length}件</div>
          </div>
        </div>
      );
    }

    // ============================================================
    // タブナビゲーション（設計書 2-1: 下部固定タブ3つ）
    // ============================================================
    const TAB_ITEMS = [
      { key: "record", label: "記録", icon: "M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z" },
      { key: "nutrition", label: "食事", icon: "M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3" },
      { key: "history", label: "履歴", icon: "M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" },
      { key: "settings", label: "設定", icon: "M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z" },
    ];

    function TabIcon({ d, active }) {
      return (
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke={active ? C.accent : C.sub} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d={d} />
        </svg>
      );
    }

    // ============================================================
    // App（メインコンポーネント）
    // ============================================================
    function App() {
      const db = useMyLiftLogDB();
      const [tab, setTab] = useState("record");

      return (
        <div style={{
          fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
          maxWidth: 480, margin: "0 auto", background: C.bg,
          minHeight: "100vh", position: "relative", color: C.text,
        }}>
          <BackupBanner />

          {/* コンテンツエリア */}
          <div style={{ padding: "16px 16px 0" }}>
            {tab === "record" && <RecordScreen db={db} />}
            {tab === "nutrition" && <NutritionScreen db={db} />}
            {tab === "history" && <HistoryScreen db={db} />}
            {tab === "settings" && <SettingsScreen db={db} />}
          </div>

          {/* 下部タブナビゲーション（設計書 7-3: 高さ56px） */}
          <div style={{
            position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)",
            width: "100%", maxWidth: 480, height: 56,
            display: "flex", background: C.bg,
            borderTop: `1px solid ${C.border}`,
            zIndex: 50,
          }}>
            {TAB_ITEMS.map((t) => (
              <button
                key={t.key}
                onClick={() => setTab(t.key)}
                style={{
                  flex: 1, display: "flex", flexDirection: "column",
                  alignItems: "center", justifyContent: "center", gap: 2,
                  background: "none", border: "none",
                  color: tab === t.key ? C.accent : C.sub,
                  fontSize: 11, fontWeight: tab === t.key ? 700 : 400,
                  cursor: "pointer",
                }}
              >
                <TabIcon d={t.icon} active={tab === t.key} />
                {t.label}
              </button>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("service-worker.js"); }</script>
</body>
</html>
